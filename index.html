<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="description" content="星轨守卫·星际守护者 —— 科幻风格 HTML5 网页游戏，坦克守护星空基地，浏览器直接开玩，无需下载安装。" />
<meta name="keywords" content="星轨守卫,星际守护者,坦克大战,HTML5游戏,网页游戏,科幻,射击游戏" />
<link rel="canonical" href="https://yanyu473.github.io/yx2/" />
<meta property="og:title" content="星轨守卫 · 星际守护者" />
<meta property="og:description" content="科幻风格 HTML5 网页游戏，浏览器直接开玩，无需下载。" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://yanyu473.github.io/yx2/" />

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#05060f" />
<title>星轨守卫 · 星际守护者</title>
<style>
/* =====================================================================
 * style.css — 星轨守卫·星际守护者  科幻界面样式
 *   深空蓝 + 霓虹青/紫/品红 配色，全屏覆盖层界面
 * ===================================================================== */
:root {
  --bg: #05060f;
  --bg2: #0a0f1f;
  --panel: rgba(12, 20, 40, 0.78);
  --panel-bd: rgba(80, 160, 255, 0.35);
  --cyan: #3ad1ff;
  --cyan-soft: #9bf6ff;
  --magenta: #ff3a6b;
  --purple: #c06bff;
  --green: #7cff8a;
  --gold: #ffd24a;
  --text: #eaf2ff;
  --text-dim: #8fa8c8;
  --neon: 0 0 8px var(--cyan), 0 0 22px rgba(58, 209, 255, 0.45);
  --rule: rgba(80, 160, 255, 0.18);
  --danger: #ff3a6b;
  --warn: #ff8a3a;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
/* 移动端浏览器地址栏收放时 100% 会抖动，dvh 可跟随可视高度变化 */
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text); user-select: none; -webkit-user-select: none;
  cursor: default;
}

#game { position: fixed; inset: 0; display: block; z-index: 0; }
#ui-root { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
/* 仅可见屏幕/确认框/技能按钮捕获事件，其余覆盖层透传给画布 */

/* ---------- 屏幕通用 ---------- */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  justify-content: safe center; /* 内容溢出时自动退回 flex-start，保证顶部可滚到 */
  gap: 22px; padding: 40px 20px;
  background: radial-gradient(circle at 50% 30%, rgba(40,80,160,0.18), rgba(2,4,12,0) 60%),
              linear-gradient(180deg, rgba(4,6,15,0.55), rgba(4,6,15,0.85));
  opacity: 0; pointer-events: none; visibility: hidden;
  transition: opacity .45s ease, transform .45s ease, visibility .45s;
  transform: scale(0.98);
  overflow-y: auto;
}
.screen.show { opacity: 1; pointer-events: auto; visibility: visible; transform: scale(1); }
.screen::-webkit-scrollbar { width: 6px; }
.screen::-webkit-scrollbar-thumb { background: var(--panel-bd); border-radius: 3px; }

/* ---------- 标题 ---------- */
.game-title {
  font-weight: 800; letter-spacing: 4px; font-size: clamp(34px, 6vw, 64px);
  color: #fff; text-align: center; line-height: 1.05;
  text-shadow: 0 0 18px rgba(58,209,255,.7), 0 0 40px rgba(192,107,255,.5);
}
.game-title .sub {
  display: block; font-size: 0.42em; letter-spacing: 10px; margin-top: 8px;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--magenta));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: hueShift 8s linear infinite;
}
.game-title .tc { display: inline-block; }
.game-title.big { animation: titleFloat 5s ease-in-out infinite; }
.game-tagline { color: var(--cyan-soft); letter-spacing: 3px; font-size: 14px; opacity: .85; }
.screen-title {
  font-weight: 700; letter-spacing: 3px; font-size: clamp(24px, 4vw, 36px);
  color: var(--cyan-soft); text-shadow: 0 0 14px rgba(58,209,255,.6); text-align: center;
}
.screen-title .ach-count { font-size: 0.5em; color: var(--gold); margin-left: 10px; }

@keyframes hueShift { to { filter: hue-rotate(360deg); } }
@keyframes titleFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* ---------- 按钮 ---------- */
.menu-btns { display: flex; flex-direction: column; gap: 14px; width: min(320px, 80vw); }
.tg-btn {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 12px 22px; border-radius: 8px; cursor: pointer; overflow: hidden;
  color: var(--text); font-family: inherit;
  background: linear-gradient(100deg, rgba(20,40,80,.85), rgba(10,16,34,.85));
  border: 1px solid var(--panel-bd);
  box-shadow: inset 0 0 12px rgba(58,209,255,.12), 0 4px 18px rgba(0,0,0,.4);
  transition: transform .18s ease, box-shadow .18s, border-color .18s;
}
.tg-btn::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--cyan), var(--purple));
  box-shadow: 0 0 10px var(--cyan);
}
.tg-btn-label { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
.tg-btn-sub { font-size: 10px; letter-spacing: 4px; color: var(--text-dim); }
.tg-btn:hover { transform: translateX(6px); border-color: var(--cyan); box-shadow: 0 0 20px rgba(58,209,255,.35), inset 0 0 16px rgba(58,209,255,.18); }
.tg-btn:active { transform: translateX(3px) scale(.99); }

.screen-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.screen-actions .tg-btn { min-width: 130px; align-items: center; }

.menu-bg-glow { position: absolute; width: 70vw; height: 70vw; max-width: 700px; max-height: 700px;
  border-radius: 50%; background: radial-gradient(circle, rgba(58,209,255,.12), transparent 60%);
  filter: blur(8px); animation: pulse 6s ease-in-out infinite; pointer-events: none; z-index: -1; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.12); opacity: 1; } }
/* ---------- 流星动画层（仅主菜单） ---------- */
.meteor-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
/* ---------- 全局动态星河背景（菜单类页面） ---------- */
#bg-stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; display: none; }

/* 单颗流星：细线 + 渐变拖尾 + 发光头部 */
.meteor {
  position: absolute;
  width: 160px; height: 2px;
  background: linear-gradient(to right, transparent, rgba(58,209,255,.15) 20%, rgba(155,246,255,.6) 65%, rgba(255,255,255,.95) 100%);
  border-radius: 2px;
  opacity: 0;
  filter: drop-shadow(0 0 4px rgba(155,246,255,.5));
}
/* 流星头部光点 */
.meteor::after {
  content: ""; position: absolute; right: -1px; top: 50%;
  transform: translateY(-50%);
  width: 5px; height: 5px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px 2px rgba(155,246,255,.8), 0 0 18px 4px rgba(58,209,255,.3);
}
/* 流星划过动画：沿旋转方向平移，淡入淡出 */
@keyframes meteorStreak {
  0%   { opacity: 0; transform: rotate(var(--rot)) translateX(0); }
  8%   { opacity: 1; }
  85%  { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--rot)) translateX(var(--dist)); }
}

.menu-foot { position: absolute; bottom: 24px; color: var(--text-dim); font-size: 13px; letter-spacing: 1px; }

/* ---------- Loading ---------- */
.load-wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.load-ring { width: 86px; height: 86px; border-radius: 50%;
  border: 4px solid rgba(58,209,255,.15); border-top-color: var(--cyan); border-right-color: var(--purple);
  animation: spin 1s linear infinite; box-shadow: 0 0 24px rgba(58,209,255,.4); }
@keyframes spin { to { transform: rotate(360deg); } }
.load-bar { width: min(320px, 70vw); height: 8px; background: rgba(20,40,80,.6); border-radius: 4px; overflow: hidden; border: 1px solid var(--panel-bd); }
.load-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--purple)); box-shadow: 0 0 12px var(--cyan); transition: width .3s; }
.load-tip { color: var(--cyan-soft); letter-spacing: 2px; font-size: 13px; }

/* ---------- 角色选择卡片 ---------- */
.char-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; width: min(900px, 94vw); }
.char-card {
  position: relative; padding: 18px 16px 16px; border-radius: 14px; cursor: pointer;
  background: linear-gradient(160deg, rgba(18,30,55,.9), rgba(8,12,26,.9));
  border: 1px solid var(--panel-bd); text-align: center;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.char-card::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%); opacity: 0; transition: opacity .3s; }
.char-card:hover { transform: translateY(-6px); border-color: var(--cc); box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 18px var(--cc); }
.char-card:hover::after { opacity: 1; }
.char-card.selected { border-color: var(--cc); box-shadow: 0 0 0 2px var(--cc), 0 0 26px var(--cc); }
.char-avatar { display: flex; justify-content: center; margin-bottom: 6px; }
.char-avatar canvas { background: radial-gradient(circle, rgba(58,209,255,.08), transparent 70%); border-radius: 10px; }
.char-card h3 { font-size: 20px; color: var(--cc); text-shadow: 0 0 10px var(--cc); }
.char-title { color: var(--text-dim); font-size: 11px; letter-spacing: 1px; margin: 2px 0 8px; }
.char-tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 10px; letter-spacing: 2px;
  background: rgba(58,209,255,.12); border: 1px solid var(--cc); color: var(--cc); margin-bottom: 10px; }
.char-stats { text-align: left; display: flex; flex-direction: column; gap: 5px; margin: 8px 0; }
.stat { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
.stat span { width: 36px; }
.stat .bar { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; border-radius: 3px; box-shadow: 0 0 6px currentColor; }
.char-desc { font-size: 11px; color: var(--text-dim); line-height: 1.5; margin-top: 6px; min-height: 32px; }

/* ---------- 关卡选择 ---------- */
.level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; width: min(900px, 94vw); }
.level-card { padding: 0 0 16px; border-radius: 14px; cursor: pointer; overflow: hidden; text-align: center;
  background: linear-gradient(160deg, rgba(18,30,55,.9), rgba(8,12,26,.9)); border: 1px solid var(--panel-bd);
  transition: transform .2s, box-shadow .2s, border-color .2s; }
.level-card:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 8px 28px rgba(0,0,0,.5), 0 0 16px var(--cyan); }
.level-card.selected { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan), 0 0 22px var(--cyan); }
.level-thumb { position: relative; }
.level-thumb canvas { display: block; width: 100%; }
.level-tag { position: absolute; top: 6px; right: 8px; color: var(--gold); font-size: 12px; text-shadow: 0 0 8px var(--gold); }
.level-card h3 { font-size: 18px; color: var(--cyan-soft); margin: 8px 0 4px; }
.level-card p { font-size: 11px; color: var(--text-dim); padding: 0 14px; line-height: 1.5; }

/* ---------- 设置 ---------- */
.settings { display: flex; flex-direction: column; gap: 16px; width: min(360px, 88vw); }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px;
  background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 8px; }
.set-row span { letter-spacing: 2px; }
.set-row input[type=range] { width: 180px; accent-color: var(--cyan); }
.switch { position: relative; width: 46px; height: 24px; display: inline-block; }
.switch input { display: none; }
.switch i { position: absolute; inset: 0; background: rgba(255,255,255,.12); border-radius: 12px; transition: .2s; border: 1px solid var(--panel-bd); }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #cfe; transition: .2s; box-shadow: 0 0 8px rgba(0,0,0,.5); }
.switch input:checked + i { background: rgba(58,209,255,.35); border-color: var(--cyan); }
.switch input:checked + i::after { left: 24px; background: var(--cyan-soft); box-shadow: 0 0 10px var(--cyan); }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; z-index: 5; }
.hud.show { opacity: 1; }
.hud-top, .hud-bot { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 18px; padding: 12px 18px; }
.hud-top { top: 0; justify-content: space-between; }
.hud-bot { bottom: 0; flex-wrap: wrap; justify-content: space-between; }
.hud-top > div { display: flex; flex-direction: column; gap: 3px; }
.hud-top span { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); }
.hud-top b { font-size: 20px; color: var(--cyan-soft); text-shadow: 0 0 8px rgba(58,209,255,.6); }
.hud-best b { color: var(--gold); text-shadow: 0 0 8px var(--gold); }
.hud-fps { min-width: 60px; }
.hud-fps b { color: #9bf6ff; font-family: "Courier New", monospace; }
.hud-fps b.bad { color: #ff8a3a; }
.hud-fps b.terrible { color: #ff3a6b; }
.hud-tension { min-width: 160px; }
.t-bar { width: 160px; height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; border: 1px solid var(--panel-bd); }
.t-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--gold), var(--magenta)); transition: width .3s; }
.hud-sync { min-width: 150px; }
.s-bar { width: 150px; height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; border: 1px solid var(--panel-bd); }
.s-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3ad1ff, #9bf6ff); transition: width .3s; }

/* 双人 HUD 玩家区块 */
.hud-player-block { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
.hud-player-block.p2 { display: none; } /* 默认隐藏 P2，双人模式时由 JS 显示 */
.hud-player-label { font-size: 14px; font-weight: 800; letter-spacing: 2px; color: var(--cyan);
  padding: 4px 8px; border: 1px solid var(--cyan); border-radius: 6px; text-shadow: 0 0 8px var(--cyan); }
.hud-player-block.p2 .hud-player-label { color: var(--magenta); border-color: var(--magenta); text-shadow: 0 0 8px var(--magenta); }
.hud-hp { display: flex; flex-direction: column; gap: 3px; }
.hud-hp span { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); }

.hp-bar { position: relative; width: 220px; height: 18px; background: rgba(255,255,255,.08); border-radius: 9px; overflow: hidden; border: 1px solid var(--panel-bd); }
.hp-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--magenta), var(--gold), var(--green)); transition: width .2s; }
.hp-bar small { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; text-shadow: 0 0 4px #000; }

.hud-skills { display: flex; gap: 10px; pointer-events: auto; }
.skill { position: relative; width: 60px; height: 60px; border-radius: 10px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--panel-bd); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: border-color .2s, box-shadow .2s; overflow: hidden; }
.skill:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(58,209,255,.4); }
.skill .sk-key { position: absolute; top: 2px; left: 5px; font-size: 10px; color: var(--gold); }
.skill .sk-name { font-size: 11px; color: var(--cyan-soft); letter-spacing: 1px; }
.skill .sk-cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.65); transition: height .1s linear; }
.skill.cooling { border-color: rgba(120,120,140,.5); }
.skill.cooling .sk-name { color: var(--text-dim); }
.skill.active { border-color: var(--cyan); box-shadow: 0 0 18px var(--cyan); animation: skillPulse 1s ease-in-out infinite; }
@keyframes skillPulse { 50% { box-shadow: 0 0 26px var(--cyan); } }

.hud-combo { position: absolute; right: 18px; bottom: 90px; font-size: 26px; font-weight: 800; color: var(--gold);
  text-shadow: 0 0 14px var(--gold); opacity: 0; transition: opacity .2s; letter-spacing: 2px; }

/* ---------- 提示条 / 成就弹窗 ---------- */
.toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%) translateY(-10px);
  padding: 8px 18px; background: var(--panel); border: 1px solid var(--cyan); border-radius: 20px;
  color: var(--cyan-soft); font-size: 13px; letter-spacing: 1px; opacity: 0; pointer-events: none;
  box-shadow: 0 0 16px rgba(58,209,255,.3); transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.ach-toast { position: absolute; top: 90px; right: 18px; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: linear-gradient(120deg, rgba(40,28,10,.92), rgba(20,12,30,.92));
  border: 1px solid var(--gold); border-radius: 12px; box-shadow: 0 0 22px rgba(255,210,74,.35);
  opacity: 0; transform: translateX(120%); transition: opacity .4s, transform .4s; pointer-events: none; max-width: 280px; }
.ach-toast.show { opacity: 1; transform: translateX(0); }
.ach-toast-ico { font-size: 30px; color: var(--gold); text-shadow: 0 0 12px var(--gold); }
.ach-toast b { font-size: 12px; color: var(--gold); letter-spacing: 2px; }
.ach-toast p { font-size: 15px; color: #fff; }
.ach-toast small { font-size: 10px; color: var(--text-dim); }

/* ====== 设置：画质档位按钮 ====== */
.qual-group { display: flex; gap: 6px; }
.qual-group button { background: rgba(255,255,255,0.05); border: 1px solid var(--panel-bd); color: var(--text-dim);
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; letter-spacing: 1px; transition: all .2s; }
.qual-group button:hover { border-color: var(--cyan); color: var(--cyan-soft); }
.qual-group button.active { background: rgba(58,209,255,0.2); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(58,209,255,0.4); }


/* 伏羲八卦 HUD */
.bagua-hud {
  position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
  background: rgba(10, 20, 40, 0.85); border: 1px solid rgba(255, 215, 0, 0.4);
  border-radius: 12px; padding: 12px 10px; z-index: 32;
  display: none; backdrop-filter: blur(6px);
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
}
.bagua-title {
  text-align: center; font-size: 12px; color: #ffd700;
  margin-bottom: 8px; letter-spacing: 2px; font-weight: bold;
  text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
}
.bagua-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 4px; width: 110px;
}
.bagua-cell {
  display: flex; flex-direction: column; align-items: center;
  padding: 4px 2px; border-radius: 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.3s; cursor: help;
}
.bagua-cell.unlocked {
  background: rgba(255, 215, 0, 0.1);
  border-color: rgba(255, 215, 0, 0.4);
  box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
  animation: baguaGlow 2s ease-in-out infinite alternate;
}
@keyframes baguaGlow {
  from { box-shadow: 0 0 4px rgba(255, 215, 0, 0.2); }
  to { box-shadow: 0 0 12px rgba(255, 215, 0, 0.5); }
}
.bagua-symbol { font-size: 22px; line-height: 1; }
.bagua-name { font-size: 10px; margin-top: 2px; opacity: 0.8; }
.bagua-meter {
  height: 4px; background: rgba(255, 255, 255, 0.1);
  border-radius: 2px; margin-top: 8px; overflow: hidden;
}
.bagua-meter-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  transition: width 0.3s;
}
.bagua-hint {
  text-align: center; font-size: 10px; color: rgba(255, 255, 255, 0.5);
  margin-top: 6px; white-space: nowrap;
}

/* ====== 战术指令 UI（小羲命令台） ====== */
.cmd-overlay { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%) translateY(20px);
  z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
.cmd-overlay.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.cmd-card { background: rgba(8,14,28,0.92); border: 1px solid var(--cyan); border-radius: 12px;
  padding: 14px 18px; box-shadow: 0 0 30px rgba(58,209,255,0.35), inset 0 0 30px rgba(58,209,255,0.06);
  width: min(480px, 92vw); max-width: 92vw; backdrop-filter: blur(6px); }
.cmd-title { font-size: 13px; color: var(--cyan); letter-spacing: 4px; margin-bottom: 10px;
  text-align: center; text-shadow: 0 0 8px rgba(58,209,255,0.6); }
.cmd-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.cmd-chip { padding: 6px 12px; background: rgba(58,209,255,0.10); border: 1px solid rgba(58,209,255,0.4);
  border-radius: 18px; color: var(--cyan-soft); font-size: 12px; cursor: pointer; user-select: none;
  transition: all .2s; position: relative; overflow: hidden; }
.cmd-chip:hover { background: rgba(58,209,255,0.25); transform: translateY(-1px); }
.cmd-chip.cooldown { color: var(--text-dim); pointer-events: none; border-color: rgba(255,255,255,0.15); }
.cmd-chip.cooldown::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,0.5); width: var(--cd, 0%); transition: width .2s; }
.cmd-input-row { display: flex; gap: 8px; }
.cmd-input-row input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--panel-bd);
  color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
.cmd-input-row input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(58,209,255,0.3); }
.cmd-input-row button { background: var(--cyan); color: #001018; border: none; padding: 8px 18px;
  border-radius: 6px; cursor: pointer; font-weight: 600; letter-spacing: 1px; font-size: 12px; }
.cmd-input-row button:hover { background: var(--cyan-soft); }
.cmd-hint { font-size: 10px; color: var(--text-dim); text-align: center; margin-top: 8px; letter-spacing: 1px; }

/* 主动技能高亮（HUD 状态） */
.cmd-flash { position: absolute; inset: 0; pointer-events: none; z-index: 15; opacity: 0;
  background: radial-gradient(circle at center, rgba(58,209,255,0.25), transparent 60%); animation: cmdFlash 0.5s ease-out; }
@keyframes cmdFlash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

/* ====== Boss / 关键角色台词气泡（z-index 高于 boss-cg，避免被遮） ====== */
.boss-line { position: absolute; left: 50%; top: 26%; transform: translateX(-50%) translateY(8px);
  z-index: 25; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  max-width: 70%; text-align: center; }
.boss-line.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.boss-line-bubble { display: inline-block; padding: 14px 28px; background: rgba(8,12,28,0.92);
  border: 1.5px solid; border-radius: 10px; font-size: 16px; letter-spacing: 2px;
  box-shadow: 0 0 28px currentColor; backdrop-filter: blur(4px); }
.boss-line-bubble small { display: block; font-size: 11px; letter-spacing: 3px;
  color: rgba(200,220,255,0.6); margin-top: 6px; font-family: "Courier New", monospace; }
.boss-line-tail { width: 2px; height: 36px; margin: -2px auto 0; background: linear-gradient(to bottom, currentColor, transparent); opacity: 0.6; }

/* ---------- 确认框 ---------- */
.confirm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(2,4,12,.6); opacity: 0; pointer-events: none; backdrop-filter: blur(3px); transition: opacity .25s; z-index: 30; }
.confirm.show { opacity: 1; pointer-events: auto; }
.confirm-box { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 36px;
  background: var(--panel); border: 1px solid var(--magenta); border-radius: 14px; box-shadow: 0 0 30px rgba(255,58,107,.35); }
.confirm-box h3 { font-size: 18px; color: #fff; text-align: center; }
.confirm-btns { display: flex; gap: 14px; }

/* ---------- Boss 出场 CG ---------- */
.boss-cg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; z-index: 20; }
.boss-cg.show { opacity: 1; animation: bcgShow 2.6s ease forwards; }
@keyframes bcgShow { 0% { opacity: 0; } 8% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.boss-cg-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,58,107,.5), transparent 60%); animation: bcgFlash .5s ease-out 2; }
@keyframes bcgFlash { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
.boss-cg-lines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 8px, rgba(255,58,107,.06) 8px 9px); animation: bcgLines 1.2s linear infinite; }
@keyframes bcgLines { to { transform: translateY(9px); } }
.boss-cg-text { text-align: center; position: relative; }
.bcg-warn { color: var(--magenta); letter-spacing: 6px; font-size: 18px; animation: bcgBlink .5s steps(2) infinite; }
@keyframes bcgBlink { 50% { opacity: .3; } }
.bcg-name { font-size: clamp(40px, 8vw, 84px); font-weight: 900; letter-spacing: 6px; color: #fff;
  text-shadow: 0 0 24px var(--magenta), 0 0 60px var(--purple); animation: bcgZoom 2.6s ease; }
.bcg-title { color: var(--cyan-soft); letter-spacing: 4px; font-size: 16px; margin-top: 8px; }
@keyframes bcgZoom { 0% { transform: scale(2.4); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

/* ---------- 结算 ---------- */
.res-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(560px, 92vw); }
.res-banner { font-size: clamp(38px, 7vw, 64px); font-weight: 900; letter-spacing: 8px; animation: resIn .6s ease; }
.res-banner.win { color: var(--green); text-shadow: 0 0 24px var(--green), 0 0 50px var(--cyan); }
.res-banner.lose { color: var(--magenta); text-shadow: 0 0 24px var(--magenta); }
@keyframes resIn { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.res-stats > div { display: flex; flex-direction: column; gap: 4px; align-items: center; padding: 10px;
  background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 8px; }
.res-stats span { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }
.res-stats b { font-size: 22px; color: var(--cyan-soft); }
.res-ach { width: 100%; }
.res-ach h4 { color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
.res-ach-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--gold);
  border-radius: 8px; margin-bottom: 6px; animation: resIn .5s ease; }
.res-ach-item .ach-ico { font-size: 24px; color: var(--gold); }
.res-ach-item b { color: #fff; } .res-ach-item small { color: var(--text-dim); font-size: 11px; }

/* ---------- 勋章展馆 ---------- */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; width: min(900px, 94vw); }
.ach-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--panel-bd); transition: transform .2s, box-shadow .2s; }
.ach-card:hover { transform: translateY(-3px); }
.ach-card.got { border-color: var(--gold); box-shadow: 0 0 16px rgba(255,210,74,.25); }
.ach-card.locked { opacity: .5; }
.ach-ico { font-size: 30px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,210,74,.12); color: var(--gold); text-shadow: 0 0 10px var(--gold); }
.ach-ico.lock { color: var(--text-dim); background: rgba(255,255,255,.05); text-shadow: none; }
.ach-info b { font-size: 15px; color: #fff; }
.ach-info p { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
.ach-info small { font-size: 10px; color: var(--gold); }

/* ---------- 屏幕提示文字 ---------- */
.screen-hint { color: var(--text-dim); font-size: 13px; letter-spacing: 2px; margin-top: -8px; }

/* ---------- 模式选择 ---------- */
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; width: min(800px, 94vw); }
.mode-card {
  position: relative; padding: 24px 18px; border-radius: 14px; cursor: pointer; text-align: center;
  background: linear-gradient(160deg, rgba(18,30,55,.9), rgba(8,12,26,.9));
  border: 1px solid var(--panel-bd);
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.mode-card:hover { transform: translateY(-6px); border-color: var(--cyan); box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 18px var(--cyan); }
.mode-card.selected { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan), 0 0 26px var(--cyan); }
.mode-icon { font-size: 40px; margin-bottom: 10px; }
.mode-card h3 { font-size: 20px; color: var(--cyan-soft); margin-bottom: 6px; }
.mode-tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 10px; letter-spacing: 2px;
  background: rgba(58,209,255,.12); border: 1px solid var(--cyan); color: var(--cyan); margin-bottom: 10px; }
.mode-card p { font-size: 12px; color: var(--text-dim); line-height: 1.5; }

/* ---------- 游戏简介 / 教程 ---------- */
.tutorial-wrap { width: min(680px, 94vw); display: flex; flex-direction: column; gap: 16px; }
.lore-art { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lore-art img { width: min(520px, 88%); border-radius: 12px; border: 1px solid rgba(90,190,255,.35); }
.lore-art-cap { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
.tut-section { background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 10px; padding: 14px 18px; }
.tut-section h3 { font-size: 16px; color: var(--cyan-soft); margin-bottom: 10px; letter-spacing: 1px; }
.tut-section p { font-size: 13px; color: var(--text); line-height: 1.7; }
.tut-section p .tut-note { color: var(--text-dim); font-size: 12px; }
.tut-keys { display: flex; flex-wrap: wrap; gap: 14px; }
.tut-key-group { display: flex; align-items: center; gap: 6px; }
.tut-label { font-size: 12px; color: var(--text-dim); min-width: 52px; letter-spacing: 1px; }
.tut-col { font-size: 12px; color: var(--cyan-soft); min-width: 36px; text-align: center; }
kbd {
  display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-family: monospace;
  background: rgba(58,209,255,.12); border: 1px solid var(--panel-bd); color: var(--cyan-soft);
  box-shadow: 0 2px 4px rgba(0,0,0,.3); min-width: 24px; text-align: center;
}

/* ---------- 勋章时间轴 ---------- */
.gallery-scroll { width: min(700px, 94vw); max-height: 72vh; overflow-y: auto; padding: 4px; }
.gallery-scroll::-webkit-scrollbar { width: 6px; }
.gallery-scroll::-webkit-scrollbar-thumb { background: var(--panel-bd); border-radius: 3px; }

.timeline { position: relative; padding-left: 32px; }
.timeline-line { position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px;
  background: linear-gradient(180deg, var(--cyan), var(--purple), var(--magenta)); box-shadow: 0 0 8px var(--cyan); }
.timeline-empty { color: var(--text-dim); font-size: 14px; padding: 20px 0; text-align: center; }
.timeline-node { position: relative; margin-bottom: 16px; }
.timeline-dot { position: absolute; left: -27px; top: 8px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--gold); border: 2px solid var(--bg); box-shadow: 0 0 10px var(--gold); z-index: 1; }
.timeline-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--gold); box-shadow: 0 0 16px rgba(255,210,74,.15);
  transition: transform .2s; }
.timeline-card:hover { transform: translateX(6px); }

.ach-locked-section { margin-top: 24px; }
.locked-title { font-size: 16px; color: var(--text-dim); letter-spacing: 3px; margin-bottom: 12px; text-align: center; }
.ach-locked-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.ach-locked-grid .ach-card.locked { opacity: .45; }

/* ---------- 排行榜 ---------- */
.lb-wrap { width: min(600px, 94vw); }
.lb-tabs { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; }
.lb-tab {
  padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer;
  background: rgba(255,255,255,0.05); border: 1px solid var(--panel-bd); color: var(--text-dim);
  transition: all .2s;
}
.lb-tab.active { background: rgba(58,209,255,0.2); border-color: var(--cyan); color: var(--cyan-soft); }
.lb-list { background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 10px; overflow: hidden; }
.lb-row {
  display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--rule);
  transition: background .2s;
}
.lb-row:last-child { border-bottom: none; }
.lb-row:hover { background: rgba(58,209,255,0.05); }
.lb-rank { width: 40px; font-size: 16px; font-weight: 800; text-align: center; }
.lb-rank.gold { color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.5); }
.lb-rank.silver { color: #c0c0c0; text-shadow: 0 0 8px rgba(192,192,192,0.5); }
.lb-rank.bronze { color: #cd7f32; text-shadow: 0 0 8px rgba(205,127,50,0.5); }
.lb-info { flex: 1; }
.lb-mech { font-size: 13px; color: var(--text); }
.lb-date { font-size: 11px; color: var(--text-dim); }
.lb-score { font-size: 18px; font-weight: 800; color: var(--cyan); }
.lb-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }

/* ---------- 语音指令按钮 ---------- */
.voice-btn {
  position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px;
  border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none; cursor: pointer; z-index: 30; display: none;
  box-shadow: 0 4px 20px rgba(58,209,255,0.4);
  transition: transform .2s, box-shadow .2s;
}
.voice-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(58,209,255,0.5); }
.voice-btn.active { animation: voicePulse 1s ease-in-out infinite; }
.voice-btn .mic { font-size: 24px; color: #fff; }
@keyframes voicePulse {
  0%,100% { box-shadow: 0 4px 20px rgba(58,209,255,0.4); }
  50% { box-shadow: 0 4px 30px rgba(255,90,122,0.6); }
}
.voice-status {
  position: fixed; right: 90px; bottom: 32px; padding: 8px 14px;
  background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 20px;
  font-size: 12px; color: var(--text-dim); z-index: 30; display: none;
  max-width: 200px;
}
.voice-status.listening { color: var(--danger); border-color: var(--danger); }

/* ---------- 剧情过场 ---------- */
.cutscene-overlay {
  position: fixed; inset: 0; z-index: 75;
  background: #000; display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px; padding: 40px;
}
.cutscene-overlay.show { display: flex; }
.cutscene-chapter {
  font-size: 12px; color: var(--text-dim); letter-spacing: 4px;
  opacity: 0; transition: opacity 1s;
}
.cutscene-chapter.show { opacity: 1; }
.cutscene-title {
  font-size: clamp(24px, 5vw, 42px); font-weight: 800; letter-spacing: 6px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  opacity: 0; transform: translateY(20px); transition: all 1.2s;
}
.cutscene-title.show { opacity: 1; transform: translateY(0); }
.cutscene-text {
  max-width: 600px; text-align: center; font-size: 14px;
  color: var(--text-dim); line-height: 2;
  opacity: 0; transition: opacity 1.5s;
}
.cutscene-text.show { opacity: 1; }
.cutscene-skip {
  position: absolute; bottom: 30px; right: 40px;
  font-size: 12px; color: var(--text-dim); cursor: pointer;
  opacity: 0.6; transition: opacity .2s;
}
.cutscene-skip:hover { opacity: 1; color: var(--cyan); }

/* ---------- 教学引导浮层 ---------- */
.tutorial-tip {
  position: fixed; left: 50%; top: 30%; transform: translateX(-50%);
  background: var(--panel); border: 2px solid var(--cyan); border-radius: 12px;
  padding: 16px 24px; z-index: 35; max-width: 360px; text-align: center;
  box-shadow: 0 0 30px rgba(58,209,255,0.3);
  animation: tutTipIn .4s ease-out;
}
@keyframes tutTipIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.9); }
  to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
.tutorial-tip h4 { color: var(--cyan-soft); font-size: 14px; margin-bottom: 8px; }
.tutorial-tip p { font-size: 12px; color: var(--text); line-height: 1.7; margin-bottom: 10px; }
.tutorial-tip .tut-ok {
  display: inline-block; padding: 4px 16px; border-radius: 16px;
  background: rgba(58,209,255,0.2); border: 1px solid var(--cyan);
  color: var(--cyan-soft); font-size: 12px; cursor: pointer;
}
.tutorial-tip .tut-ok:hover { background: rgba(58,209,255,0.3); }

/* ---------- 新兵训练 ---------- */
.training-card { border-color: #5ff0ff !important; box-shadow: 0 0 12px rgba(95,240,255,.18) inset; }
.training-card.selected { box-shadow: 0 0 22px rgba(95,240,255,.35), 0 0 12px rgba(95,240,255,.18) inset; }
#hud-training {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: none; pointer-events: none; z-index: 7;
  background: linear-gradient(180deg, rgba(8,20,32,.82), rgba(8,20,32,.55));
  border: 1px solid rgba(95,240,255,.55);
  border-radius: 6px; padding: 7px 14px; min-width: 320px; max-width: 80vw;
  font-size: 12px; letter-spacing: 1px; color: #cfe6ff; text-align: center;
  box-shadow: 0 0 18px rgba(95,240,255,.18);
}
#hud-training.show { display: block; }
#hud-training .t-step { display: inline-block; padding: 1px 8px; margin-right: 8px; background: rgba(95,240,255,.18); border: 1px solid rgba(95,240,255,.45); border-radius: 4px; font-weight: 700; color: #5ff0ff; font-size: 11px; }
#hud-training .t-obj { color: #cfe6ff; }
#hud-training .t-bar { display: block; height: 3px; margin-top: 5px; background: rgba(95,240,255,.15); border-radius: 2px; overflow: hidden; }
#hud-training .t-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #5ff0ff, #9bf6ff); transition: width .25s ease-out; width: 0; }
#training-complete {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(2,4,12,.88);
  display: none; align-items: center; justify-content: center; flex-direction: column;
  gap: 16px; color: #cfe6ff; text-align: center; padding: 24px;
}
#training-complete.show { display: flex; }
#training-complete h2 { font-size: 26px; letter-spacing: 8px; color: #5ff0ff; text-shadow: 0 0 18px rgba(95,240,255,.5); margin: 0; font-weight: 700; }
#training-complete .tc-sub { font-size: 13px; opacity: .8; letter-spacing: 2px; }
#training-complete p { font-size: 13px; opacity: .88; max-width: 460px; line-height: 1.8; margin: 0; }
#training-complete .tc-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
#training-complete .tc-actions button {
  background: rgba(95,240,255,.12); border: 1px solid rgba(95,240,255,.5);
  color: #cfe6ff; padding: 9px 20px; border-radius: 4px;
  font-size: 13px; letter-spacing: 2px; cursor: pointer;
  font-family: inherit; transition: background .2s;
}
#training-complete .tc-actions button:hover { background: rgba(95,240,255,.28); }
#training-complete .tc-actions button.primary { background: rgba(95,240,255,.22); border-color: rgba(95,240,255,.75); color: #9bf6ff; }

/* ---------- 八卦技能系统 ---------- */
.bagua-panel {
  position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
  display: none; z-index: 35;
}
.bagua-panel.show { display: block; }
.bagua-wheel {
  width: 260px; height: 260px; position: relative;
  background: radial-gradient(circle, rgba(58,209,255,0.1), transparent 70%);
}
.bagua-center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  box-shadow: 0 0 20px rgba(58,209,255,0.5);
  z-index: 2;
}
.bagua-skill {
  position: absolute; width: 54px; height: 54px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--panel-bd);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all .2s;
  font-size: 10px; color: var(--text-dim);
}
.bagua-skill:hover { border-color: var(--cyan); transform: scale(1.15); color: var(--cyan-soft); box-shadow: 0 0 15px rgba(58,209,255,0.4); }
.bagua-skill.cooling { opacity: 0.4; cursor: not-allowed; }
.bagua-skill .bs-ico { font-size: 20px; margin-bottom: 2px; }
.bagua-skill .bs-cd { position: absolute; font-size: 11px; font-weight: 700; color: var(--danger); }

/* ---------- 性能模式指示器 ---------- */
.perf-indicator {
  position: fixed; top: 10px; right: 10px; padding: 4px 10px;
  background: rgba(0,0,0,0.5); border-radius: 4px; font-size: 11px;
  color: var(--text-dim); z-index: 20; pointer-events: none;
  font-family: monospace;
}

/* ---------- AIGC 合规标注 ---------- */

.credits-table th { color: var(--text-dim); font-weight: 400; letter-spacing: 1px; font-size: 11px; }
.credits-table td { color: var(--text); line-height: 1.6; }
.credits-table td:first-child { color: var(--cyan-soft); white-space: nowrap; }
.ratio-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 11px; }
.ratio-row .rr-name { width: 72px; color: var(--text-dim); white-space: nowrap; }

.ratio-bar .ai { background: linear-gradient(90deg, var(--cyan), var(--purple)); }

.ratio-row .rr-val { width: 84px; text-align: right; color: var(--text-dim); white-space: nowrap; }

.credits-decl {

.credits-decl small { display: block; margin-top: 6px; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }

<body><div id="boot-loader"><div class="bl-core"><div class="bl-orbit"></div><div class="bl-title">星轨守卫</div><div class="bl-sub">星 际 守 护 者 · 加 载 中</div><div class="bl-bar"><i></i></div><div class="bl-pct">0%</div><div class="bl-tip">首次加载约 2 MB，正在建立星际链路…</div></div></div>
<canvas id="game"></canvas>
<div id="ui-root"></div>
<canvas id="bg-stars"></canvas>
<script>
(function () {
  const cv = document.getElementById('bg-stars');
  const ctx = cv.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, stars = [], dust = [], nodes = [], edges = [], meteors = [], bandDust = [], shapes = [], planets = [], galaxy = null, galaxyStars = [], clusters = [], gates = [], fleets = [], pulses = [];
  const SHOW_STATES = ['menu', 'char', 'mode', 'level', 'tutorial', 'story', 'credits', 'gallery', 'leaderboard', 'settings', 'loading'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function galGeo(u) {
    const g = galaxy; const ax = Math.cos(g.ang), ay = Math.sin(g.ang), nx = -ay, ny = ax;
    const v = Math.sin(u * 3.0 + g.ph) * g.wavy + Math.cos(u * 1.7) * 0.02;
    return { x: (g.cx + ax * u * 1.2 + nx * v) * W, y: (g.cy + ay * u * 1.2 + ny * v) * H };
  }
  function build() {
    // 星河主星（原有：多层视差 + 闪烁）
    stars = [];
    const n = Math.max(150, Math.round((W * H) / 6800));
    for (let i = 0; i < n; i++) {
      const layer = Math.random();
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.4 + layer * 1.7,
        a: 0.22 + Math.random() * 0.6,
        tw: Math.random() * Math.PI * 2,
        ts: 0.4 + Math.random() * 1.7,
        dx: (0.015 + layer * 0.05) * (Math.random() < 0.5 ? -1 : 1),
        dy: (0.012 + layer * 0.04) * (Math.random() < 0.5 ? -1 : 1),
        hue: Math.random() < 0.5 ? '200,230,255' : (Math.random() < 0.5 ? '150,205,255' : '205,175,255')
      });
    }
    // 星尘微粒子：更密更小、极缓慢漂移，增加背景厚度
    dust = [];
    const dn = Math.max(90, Math.round((W * H) / 15000));
    for (let i = 0; i < dn; i++) {
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.3 + Math.random() * 0.9,
        a: 0.05 + Math.random() * 0.24,
        dx: rnd(-0.05, 0.05), dy: rnd(-0.04, 0.04),
        hue: Math.random() < 0.6 ? '170,200,255' : '200,160,255'
      });
    }
    // 星链网络：少量锚点星 + 最近邻连线（呼应"星链网络"世界观，极淡呼吸）
    nodes = [];
    const nn = Math.max(13, Math.round(W / 110));
    for (let i = 0; i < nn; i++) {
      nodes.push({
        x: Math.random() * W, y: Math.random() * H,
        px: Math.random() * Math.PI * 2, py: Math.random() * Math.PI * 2,
        ax: rnd(0.4, 1.0), ay: rnd(0.4, 1.0),
        ph: Math.random() * Math.PI * 2
      });
    }
    edges = [];
    for (let i = 0; i < nodes.length; i++) {
      const ds = [];
      for (let j = 0; j < nodes.length; j++) if (j !== i) {
        ds.push({ j, d: Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y) });
      }
      ds.sort((a, b) => a.d - b.d);
      const k = 1 + (Math.random() < 0.4 ? 1 : 0);
      for (let mm = 0; mm < k; mm++) { const j = ds[mm].j; if (i < j) edges.push([i, j, rnd(0.5, 1)]); }
    }
    // 星尘带（斜向极淡星尘，集中在一条带内缓慢漂移）
    bandDust = [];
    {
      const bn = Math.max(170, Math.round((W * H) / 8500));
      const ang = rnd(-0.45, 0.45);
      const cx = rnd(0.2, 0.8), cy = rnd(0.2, 0.8);
      const ax = Math.cos(ang), ay = Math.sin(ang), nx = -ay, ny = ax;
      for (let i = 0; i < bn; i++) {
        const u = (Math.random() - 0.5) * 1.5;
        const v = (Math.random() + Math.random() - 1) * 0.11;
        bandDust.push({
          x: (cx + ax * u) * W + nx * v * W,
          y: (cy + ay * u) * H + ny * v * H,
          r: 0.3 + Math.random() * 0.9,
          a: 0.04 + Math.random() * 0.15,
          dx: rnd(-0.05, 0.05), dy: rnd(-0.04, 0.04)
        });
      }
    }
    // 漂浮几何体（细线框，极淡，缓慢旋转漂移）
    shapes = [];
    {
      const sn = Math.max(5, Math.round(W / 320));
      for (let i = 0; i < sn; i++) {
        shapes.push({
          x: Math.random() * W, y: Math.random() * H,
          size: rnd(26, 72),
          sides: [3, 4, 6][(Math.random() * 3) | 0],
          rot: Math.random() * 6.28, rs: rnd(-0.0016, 0.0016),
          dx: rnd(-0.08, 0.08), dy: rnd(-0.06, 0.06),
          a: rnd(0.05, 0.13),
          hue: Math.random() < 0.5 ? '58,209,255' : (Math.random() < 0.5 ? '192,107,255' : '120,180,255')
        });
      }
    }
    // 银河（一条横跨画面的连续柔光带 + 沿带密集星）
    const m0 = Math.min(W, H);
    galaxy = { cx: rnd(0.30, 0.70), cy: rnd(0.28, 0.66), ang: rnd(-0.5, 0.5), wavy: rnd(0.06, 0.12), ph: Math.random() * 6.28 };
    galaxyStars = [];
    const gn = Math.max(500, Math.round((W * H) / 2600));
    const gax = Math.cos(galaxy.ang), gay = Math.sin(galaxy.ang), gnx = -gay, gny = gax;
    for (let i = 0; i < gn; i++) {
      const u = Math.random() - 0.5;
      const bx = (galaxy.cx + gax * u * 1.2) * W, by = (galaxy.cy + gay * u * 1.2) * H;
      const v = (Math.random() + Math.random() + Math.random() - 1.5) / 3.464 * 0.38;
      const x = bx + gnx * v * W, y = by + gny * v * H;
      const roll = Math.random();
      const hue = roll < 0.58 ? '200,225,255' : (roll < 0.72 ? '140,205,255' : (roll < 0.83 ? '180,150,255' : (roll < 0.92 ? '255,220,170' : '255,170,205')));
      galaxyStars.push({
        x: x, y: y, dx: rnd(-0.06, 0.06), dy: rnd(0.35, 1.3),
        r: rnd(0.35, 1.7), len: rnd(5, 22),
        a: rnd(0.32, 0.92), tw: Math.random() * 6.28, ts: rnd(0.3, 1.2),
        hue: hue
      });
    }
    // 多颗星球（缓慢从左向右循环移动；海王星蓝 / 冥王星褐 配色，布局错开）
    planets = [
      { type: 'ring', x: rnd(-0.05, 0.08) * W, y: rnd(0.14, 0.26) * H, r: rnd(0.10, 0.14) * m0,
        ring: rnd(1.5, 1.9), ringTilt: rnd(-0.4, 0.4), dx: rnd(0.05, 0.09), dy: 0,
        c: '58,92,205', a: rnd(0.46, 0.62), spin0: Math.random() * 6.28, vspin: rnd(0.05, 0.12) },
      { type: 'moon', x: rnd(0.34, 0.48) * W, y: rnd(0.46, 0.60) * H, r: rnd(0.09, 0.13) * m0,
        dx: rnd(0.045, 0.085), dy: 0, c: '152,116,96', a: rnd(0.42, 0.56),
        moonR: rnd(0.18, 0.28), moonDist: rnd(1.6, 2.2), moonPh: Math.random() * 6.28 },
      { type: 'aurora', x: rnd(0.70, 0.86) * W, y: rnd(0.66, 0.82) * H, r: rnd(0.10, 0.14) * m0,
        dx: rnd(0.05, 0.09), dy: 0, c: '48,112,178', a: rnd(0.42, 0.56),
        spin0: Math.random() * 6.28, vspin: rnd(0.06, 0.14) }
    ];
    // 星辰（几处更亮的星簇，营造密集星区）
    clusters = [];
    const cn = Math.max(3, Math.round(W / 520));
    for (let i = 0; i < cn; i++) {
      const ccx = Math.random() * W, ccy = Math.random() * H, kids = [];
      const kn = 18 + Math.floor(Math.random() * 16);
      for (let j = 0; j < kn; j++) {
        const ang = Math.random() * 6.28, rad = Math.random() * m0 * 0.05;
        kids.push({ x: ccx + Math.cos(ang) * rad, y: ccy + Math.sin(ang) * rad,
          r: 0.4 + Math.random() * 1.1, a: 0.2 + Math.random() * 0.5, tw: Math.random() * 6.28, ts: 0.5 + Math.random() * 1.6 });
      }
      clusters.push({ x: ccx, y: ccy, kids: kids, ph: Math.random() * 6.28 });
    }
    // 远景星门（呼应入场过场动画：极淡霓虹环 + 门内能量微光）
    gates = [];
    const gtn = 2;
    for (let i = 0; i < gtn; i++) {
      gates.push({
        x: rnd(0.10, 0.90) * W, y: rnd(0.16, 0.56) * H,
        r: rnd(0.15, 0.25) * m0, rot: rnd(-0.32, 0.32),
        ph: Math.random() * 6.28, a: rnd(0.07, 0.13)
      });
    }
    // 巡弋战机编队（远景守护者机甲剪影，缓慢横掠）
    fleets = [];
    const fn = Math.max(2, Math.round(W / 700));
    for (let i = 0; i < fn; i++) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const n = 2 + Math.floor(Math.random() * 3);
      const units = [];
      for (let k = 0; k < n; k++) {
        units.push({ ox: -k * rnd(16, 26), oy: rnd(-9, 9) * (k % 2 ? 1 : -1) });
      }
      fleets.push({
        x: Math.random() * W, y: rnd(0.10, 0.62) * H,
        sp: rnd(0.10, 0.22) * dir, units: units,
        sc: rnd(0.5, 0.9), a: rnd(0.18, 0.34), ph: Math.random() * 6.28
      });
    }
    pulses = [];
    meteors = [];
  }
  function spawnMeteor() {
    const fromLeft = Math.random() < 0.5;
    const y = rnd(0, H * 0.62);
    const sp = rnd(4, 7) * (fromLeft ? 1 : -1);
    meteors.push({
      x: fromLeft ? -40 : W + 40, y,
      vx: sp, vy: sp * rnd(0.22, 0.5),
      life: 0, max: rnd(60, 110), len: rnd(70, 150)
    });
  }
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }
  let running = false;
  function frame(now) {
    if (!running) return;
    const t = now * 0.001;
    ctx.clearRect(0, 0, W, H);
    // 星云辉光（原有 3 团）
    ctx.globalCompositeOperation = 'screen';
    const m = Math.min(W, H);
    const blobs = [
      { x: 0.24, y: 0.30, r: 0.44, c: '58,209,255', ph: 1.1 },
      { x: 0.80, y: 0.24, r: 0.40, c: '192,107,255', ph: 3.3 },
      { x: 0.56, y: 0.80, r: 0.48, c: '255,58,107', ph: 5.0 }
    ];
    for (const b of blobs) {
      const bx = (b.x + Math.sin(t * 0.11 + b.ph) * 0.05) * W;
      const by = (b.y + Math.cos(t * 0.09 + b.ph) * 0.05) * H;
      const rr = b.r * m;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
      const pulse = 0.085 + 0.05 * Math.sin(t * 0.6 + b.ph);
      g.addColorStop(0, 'rgba(' + b.c + ',' + pulse.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + b.c + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, rr, 0, 6.28); ctx.fill();
    }
    // 银河星雨（参考视频：密集星点向下垂落，蓝白为主 + 少量暖色，带短拖尾）
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const s of galaxyStars) {
      s.x += s.dx; s.y += s.dy;
      if (s.y - s.len > H) { s.y = -s.len; s.x = Math.random() * W; }
      if (s.x < -20) s.x = W + 20; else if (s.x > W + 20) s.x = -20;
      const tw = 0.5 + 0.5 * Math.sin(t * s.ts + s.tw);
      const a = s.a * tw;
      const g = ctx.createLinearGradient(s.x, s.y - s.len, s.x, s.y);
      g.addColorStop(0, 'rgba(' + s.hue + ',0)');
      g.addColorStop(1, 'rgba(' + s.hue + ',' + Math.max(0, a).toFixed(3) + ')');
      ctx.strokeStyle = g; ctx.lineWidth = s.r;
      ctx.beginPath(); ctx.moveTo(s.x, s.y - s.len); ctx.lineTo(s.x, s.y); ctx.stroke();
      ctx.fillStyle = 'rgba(245,250,255,' + Math.min(1, a * 1.15).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.55, 0, 6.28); ctx.fill();
    }
    // 星球（流星式真实：柔和受光 + 羽化外辉光 + 无硬边大气，缓慢漂移）
    ctx.save();
    for (const p of planets) {
      p.x += p.dx; p.y += p.dy;
      if (p.x - p.r * 1.5 > W) p.x = -p.r * 1.5; // 出右界后从左侧重新进入（保持从左向右循环）
      if (p.y < -p.r * 2) p.y = H + p.r * 2; else if (p.y > H + p.r * 2) p.y = -p.r * 2;
      const lx = p.x - p.r * 0.34, ly = p.y - p.r * 0.34; // 光源固定在左上方
      const dark = p.c.split(',').map(function (v) { return Math.round(parseFloat(v) * 0.34); }).join(',');
      // 1) 羽化外辉光（lighter，柔和，像流星光晕）
      ctx.globalCompositeOperation = 'lighter';
      const hg = ctx.createRadialGradient(p.x, p.y, p.r * 0.85, p.x, p.y, p.r * 2.6);
      hg.addColorStop(0, 'rgba(' + p.c + ',' + (p.a * 0.5).toFixed(3) + ')');
      hg.addColorStop(1, 'rgba(' + p.c + ',0)');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2, 0, 6.28); ctx.fill();
      // 2) 行星环后段（球体之前，偏暗）
      if (p.type === 'ring') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ringTilt);
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = Math.max(2, p.r * 0.06);
        ctx.strokeStyle = 'rgba(' + p.c + ',' + (p.a * 0.35).toFixed(3) + ')';
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * p.ring, p.r * p.ring * 0.28, 0, Math.PI, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      // 3) 球体：中度暗底 + 柔和受光面（平滑衰减，无硬边）
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(' + dark + ',' + Math.min(1, p.a + 0.5).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
      const g = ctx.createRadialGradient(lx, ly, p.r * 0.12, p.x, p.y, p.r * 1.06);
      g.addColorStop(0, 'rgba(' + p.c + ',' + Math.min(1, p.a * 2.0).toFixed(3) + ')');
      g.addColorStop(0.55, 'rgba(' + p.c + ',' + (p.a * 0.95).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + p.c + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
      // 4) 极柔大气光（羽化环，无硬边，仅朝光侧略亮）
      ctx.globalCompositeOperation = 'lighter';
      const at = ctx.createRadialGradient(lx, ly, p.r * 0.5, p.x, p.y, p.r * 1.07);
      at.addColorStop(0, 'rgba(205,228,255,' + (p.a * 0.14).toFixed(3) + ')');
      at.addColorStop(0.6, 'rgba(205,228,255,0)');
      at.addColorStop(1, 'rgba(205,228,255,0)');
      ctx.fillStyle = at; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.07, 0, 6.28); ctx.fill();
      // 5) 行星环前段（球体之前，受光侧略亮）
      if (p.type === 'ring') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ringTilt);
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = Math.max(2, p.r * 0.06);
        ctx.strokeStyle = 'rgba(215,235,255,' + Math.min(0.7, p.a * 0.9).toFixed(3) + ')';
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * p.ring, p.r * p.ring * 0.28, 0, 0, Math.PI); ctx.stroke();
        ctx.restore();
      } else if (p.type === 'moon') {
        const ma = p.moonPh + t * 0.3, mx = p.x + Math.cos(ma) * p.r * p.moonDist, my = p.y + Math.sin(ma) * p.r * p.moonDist * 0.5;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(' + dark + ',' + Math.min(1, p.a + 0.25).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(mx, my, p.r * p.moonR, 0, 6.28); ctx.fill();
        const mg = ctx.createRadialGradient(mx - p.r * p.moonR * 0.32, my - p.r * p.moonR * 0.32, p.r * p.moonR * 0.1, mx, my, p.r * p.moonR * 1.04);
        mg.addColorStop(0, 'rgba(' + p.c + ',' + Math.min(1, p.a * 1.2).toFixed(3) + ')');
        mg.addColorStop(0.6, 'rgba(' + p.c + ',' + (p.a * 0.45).toFixed(3) + ')');
        mg.addColorStop(1, 'rgba(' + p.c + ',0)');
        ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, p.r * p.moonR, 0, 6.28); ctx.fill();
      } else if (p.type === 'aurora') {
        ctx.globalCompositeOperation = 'lighter';
        for (let k = 0; k < 2; k++) {
          const aa = p.a * (1.0 - k * 0.3) * (0.5 + 0.5 * Math.sin(t * 0.7 + p.x));
          ctx.strokeStyle = 'rgba(' + (k ? '120,255,180' : '90,200,255') + ',' + Math.min(0.6, aa).toFixed(3) + ')'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.ellipse(p.x, p.y - p.r * 0.2, p.r * 0.95, p.r * 0.55, k ? 0.3 : -0.3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        }
      }
    }
    ctx.restore();
    // 星链网络（极淡连线 + 节点呼吸）
    ctx.globalCompositeOperation = 'lighter';
    const np = nodes.map(nd => ({
      x: nd.x + Math.sin(t * 0.0006 * nd.ax + nd.px) * 12,
      y: nd.y + Math.cos(t * 0.0005 * nd.ay + nd.py) * 12
    }));
    ctx.lineWidth = 0.6;
    for (const [i, j, w] of edges) {
      const a = np[i], b = np[j];
      const br = 0.05 + 0.05 * Math.sin(t * 0.5 + (i + j));
      ctx.strokeStyle = 'rgba(120,180,255,' + (br * w).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (let i = 0; i < np.length; i++) {
      const p = np[i], br = 0.4 + 0.4 * Math.sin(t * 0.6 + nodes[i].ph);
      ctx.fillStyle = 'rgba(190,220,255,' + br.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, 6.28); ctx.fill();
    }
    // 星尘微粒子
    for (const d of dust) {
      d.x += d.dx; d.y += d.dy;
      if (d.x < 0) d.x += W; else if (d.x > W) d.x -= W;
      if (d.y < 0) d.y += H; else if (d.y > H) d.y -= H;
      ctx.fillStyle = 'rgba(' + d.hue + ',' + d.a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.28); ctx.fill();
    }
    // 星尘带（斜向极淡星尘流）
    for (const b of bandDust) {
      b.x += b.dx; b.y += b.dy;
      if (b.x < 0) b.x += W; else if (b.x > W) b.x -= W;
      if (b.y < 0) b.y += H; else if (b.y > H) b.y -= H;
      ctx.fillStyle = 'rgba(160,200,255,' + b.a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
    }
    // 漂浮几何体（极淡细线框，缓慢旋转漂移）
    for (const sh of shapes) {
      sh.x += sh.dx; sh.y += sh.dy; sh.rot += sh.rs;
      if (sh.x < -90) sh.x = W + 90; else if (sh.x > W + 90) sh.x = -90;
      if (sh.y < -90) sh.y = H + 90; else if (sh.y > H + 90) sh.y = -90;
      ctx.save(); ctx.translate(sh.x, sh.y); ctx.rotate(sh.rot);
      ctx.strokeStyle = 'rgba(' + sh.hue + ',' + sh.a.toFixed(3) + ')'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 0; k <= sh.sides; k++) {
        const th = (k / sh.sides) * 6.2832 - Math.PI / 2;
        const px = Math.cos(th) * sh.size, py = Math.sin(th) * sh.size;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.restore();
    }
    // 星河主星
    for (const s of stars) {
      s.x += s.dx; s.y += s.dy;
      if (s.x < 0) s.x += W; else if (s.x > W) s.x -= W;
      if (s.y < 0) s.y += H; else if (s.y > H) s.y -= H;
      const a = s.a * (0.5 + 0.5 * Math.sin(t * s.ts + s.tw));
      ctx.fillStyle = 'rgba(' + s.hue + ',' + Math.max(0, a).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    // 星辰（更亮的星簇，呼吸明灭）
    for (const cl of clusters) {
      const br = 0.6 + 0.4 * Math.sin(t * 0.5 + cl.ph);
      for (const k of cl.kids) {
        const a = k.a * br * (0.6 + 0.4 * Math.sin(t * k.ts + k.tw));
        ctx.fillStyle = 'rgba(210,225,255,' + Math.max(0, a).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 6.28); ctx.fill();
      }
    }
    // 远景星门（极淡霓虹环 + 门内能量微光）
    for (const gt of gates) {
      const pulseA = gt.a * (0.7 + 0.3 * Math.sin(t * 0.7 + gt.ph));
      ctx.save();
      ctx.translate(gt.x, gt.y); ctx.rotate(gt.rot);
      ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, gt.r);
      gg.addColorStop(0, 'rgba(150,205,255,' + (pulseA * 0.5).toFixed(3) + ')');
      gg.addColorStop(0.55, 'rgba(90,140,235,' + (pulseA * 0.22).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(60,90,200,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.ellipse(0, 0, gt.r * 0.52, gt.r * 0.86, 0, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(140,215,255,' + (pulseA * 1.1).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, gt.r * 0.52, gt.r * 0.86, 0, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,235,255,' + (pulseA * 0.5).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, gt.r * 0.62, gt.r, 0, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = 'rgba(170,225,255,' + (pulseA * 1.3).toFixed(3) + ')';
      for (let k = 0; k < 4; k++) {
        const th = k * 1.5708 + 0.7854;
        ctx.beginPath(); ctx.arc(Math.cos(th) * gt.r * 0.52, Math.sin(th) * gt.r * 0.86, 1.6, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }
    // 能量脉冲环（周期性从星门向外扩散）
    if (gates.length && Math.random() < 0.01) {
      const g0 = gates[Math.floor(Math.random() * gates.length)];
      pulses.push({ x: g0.x, y: g0.y, r0: g0.r * 0.3, spread: g0.r * rnd(0.8, 1.5), a: rnd(0.25, 0.45), life: 0, max: rnd(110, 190) });
    }
    for (let i = pulses.length - 1; i >= 0; i--) {
      const pu = pulses[i];
      pu.life += 1;
      const pr = pu.life / pu.max;
      if (pr >= 1) { pulses.splice(i, 1); continue; }
      const rr = pu.r0 + pr * pu.spread;
      const pa = pu.a * (1 - pr) * (1 - pr);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(150,215,255,' + pa.toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(pu.x, pu.y, rr * 0.55, rr, 0, 0, 6.2832); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    // 巡弋战机编队（远景守护者机甲剪影 + 尾焰）
    for (const fl of fleets) {
      fl.x += fl.sp;
      if (fl.sp > 0 && fl.x > W + 140) fl.x = -140;
      else if (fl.sp < 0 && fl.x < -140) fl.x = W + 140;
      const bob = Math.sin(t * 0.6 + fl.ph) * 3;
      ctx.save();
      ctx.translate(fl.x, fl.y + bob);
      ctx.scale(fl.sp > 0 ? fl.sc : -fl.sc, fl.sc);
      for (const u of fl.units) {
        ctx.save();
        ctx.translate(u.ox, u.oy);
        ctx.fillStyle = 'rgba(24,42,70,' + (fl.a + 0.35).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(7, 0); ctx.lineTo(-5, 4); ctx.lineTo(-3, 0); ctx.lineTo(-5, -4);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(150,215,255,' + fl.a.toFixed(3) + ')';
        ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = 'rgba(190,235,255,' + (fl.a * 1.4).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(0, 0, 1.2, 0, 6.2832); ctx.fill();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(120,200,255,' + (fl.a * 0.5).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(-7, 0, 1.8 + Math.sin(t * 8 + fl.ph) * 0.5, 0, 6.2832); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();
      }
      ctx.restore();
    }
    // 流星（随机划过、带渐变拖尾）
    if (Math.random() < 0.012 && meteors.length < 4) spawnMeteor();
    ctx.lineCap = 'round';
    for (let i = meteors.length - 1; i >= 0; i--) {
      const mo = meteors[i];
      mo.life++; mo.x += mo.vx; mo.y += mo.vy;
      const fade = 1 - mo.life / mo.max;
      if (fade <= 0 || mo.x < -80 || mo.x > W + 80) { meteors.splice(i, 1); continue; }
      const mag = Math.hypot(mo.vx, mo.vy);
      const tx = mo.x - mo.vx / mag * mo.len, ty = mo.y - mo.vy / mag * mo.len;
      const grad = ctx.createLinearGradient(mo.x, mo.y, tx, ty);
      grad.addColorStop(0, 'rgba(220,240,255,' + (0.9 * fade).toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(120,180,255,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(mo.x, mo.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = 'rgba(235,245,255,' + (0.9 * fade).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(mo.x, mo.y, 1.6, 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  function start() { if (!running) { running = true; requestAnimationFrame(frame); } }
  function stop() { running = false; ctx.clearRect(0, 0, W, H); }
  window.StarBG = {
    setVisible: function (v) { cv.style.display = v ? 'block' : 'none'; if (v) start(); else stop(); },
    states: SHOW_STATES
  };
  window.addEventListener('resize', resize);
  resize();
})();

/* ===== 标题平滑渐变变色（星轨守卫四字同色，仅菜单类页面） =====
 * 四字始终为同一种颜色，色相在「安全区间」内缓慢来回漂移，
 * 连续插值、无硬跳变；红色区间(≈0°/360°)被排除，永不变红。 */
(function () {
  let raf = null;
  let hue = 195;          // 当前色相(度)
  let dir = 1;            // 漂移方向：+1 增 / -1 减
  const SPEED = 0.18;     // 每帧色相增量(度) ≈ 10°/秒，足够慢
  const HUE_MIN = 45;     // 安全区间下界：黄(避开红0°)
  const HUE_MAX = 305;    // 安全区间上界：粉紫(避开红)
  const SAT = 92, LIG = 64; // 霓虹质感：高饱和、中高亮度
  function step() {
    hue += SPEED * dir;
    if (hue >= HUE_MAX) { hue = HUE_MAX; dir = -1; }
    else if (hue <= HUE_MIN) { hue = HUE_MIN; dir = 1; }
    const h = hue.toFixed(1);
    const col = 'hsl(' + h + ',' + SAT + '%,' + LIG + '%)';
    const glow1 = 'hsla(' + h + ',' + SAT + '%,' + LIG + '%,.75)';
    const glow2 = 'hsla(' + h + ',' + SAT + '%,' + LIG + '%,.45)';
    const els = document.querySelectorAll('.game-title .tc');
    for (const el of els) {
      el.style.color = col;
      el.style.textShadow = '0 0 18px ' + glow1 + ', 0 0 40px ' + glow2;
    }
    raf = requestAnimationFrame(step);
  }
  window.TitleColor = {
    setVisible: function (v) {
      if (v) { if (!raf) { step(); } }
      else { if (raf) { cancelAnimationFrame(raf); raf = null; } }
    }
  };
})();
</script>

<script>
(function () {
  'use strict';
  var el = document.getElementById('boot-loader');
  if (!el) return;
  var bar = el.querySelector('.bl-bar i'),
      pct = el.querySelector('.bl-pct'),
      tip = el.querySelector('.bl-tip');
  var finished = false;
  function setP(p) { bar.style.width = p + '%'; pct.textContent = p + '%'; }
  function finish() {
    if (finished) return; finished = true;
    setP(100);
    setTimeout(function () {
      el.classList.add('bl-out');
      setTimeout(function () { el.remove(); }, 750);
    }, 280);
  }
  // 游戏主对象挂载后收屏（main.js boot 时设置 window.TG_GAME）
  var watch = setInterval(function () {
    if (window.TG_GAME) { clearInterval(watch); finish(); }
  }, 120);
  setTimeout(function () { if (!finished) tip.textContent = '网络较慢，仍在加载…请保持页面打开'; }, 12000);

  // 流式下载 game.bundle.js，展示真实进度；完成后注入执行
  fetch('game.bundle.js', { cache: 'force-cache' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var total = +(r.headers.get('Content-Length') || 0);
    if (!r.body || !total) return r.blob();
    var reader = r.body.getReader(), got = 0, chunks = [];
    function pump(part) {
      if (part.value) { got += part.value.length; chunks.push(part.value); }
      setP(Math.min(99, Math.round(got / total * 100)));
      if (part.done) return new Blob(chunks, { type: 'text/javascript' });
      return reader.read().then(pump);
    }
    return reader.read().then(pump);
  }).then(function (blob) {
    var url = URL.createObjectURL(blob);
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { URL.revokeObjectURL(url); };
    s.onerror = function () { tip.textContent = '脚本执行失败，请刷新重试'; tip.style.color = '#ff3a6b'; };
    document.body.appendChild(s);
  }).catch(function (e) {
    tip.textContent = '加载失败(' + ((e && e.message) || '网络错误') + ')，请检查网络后刷新重试';
    tip.style.color = '#ff3a6b';
  });
})();
</script>
