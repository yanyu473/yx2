<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#05060f" />
<title>坦克大战 · 星际守护者</title>
<style>
/* =====================================================================
 * style.css — 坦克大战·星际守护者  科幻界面样式
 *   深空蓝 + 霓虹青/紫/品红 配色，全屏覆盖层界面
 * ===================================================================== */
:root {
  --bg: #05060f;
  --bg2: #0a0f1f;
  --panel: rgba(12, 20, 40, 0.78);
  --panel-bd: rgba(80, 160, 255, 0.35);
  --cyan: #3ad1ff;
  --cyan-soft: #9bf6ff;
  --magenta: #ff3a6b;
  --purple: #c06bff;
  --green: #7cff8a;
  --gold: #ffd24a;
  --text: #eaf2ff;
  --text-dim: #8fa8c8;
  --neon: 0 0 8px var(--cyan), 0 0 22px rgba(58, 209, 255, 0.45);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text); user-select: none; -webkit-user-select: none;
  cursor: default;
}

#game { position: fixed; inset: 0; display: block; z-index: 0; }
#ui-root { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
/* 仅可见屏幕/确认框/技能按钮捕获事件，其余覆盖层透传给画布 */

/* ---------- 屏幕通用 ---------- */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 40px 20px;
  background: radial-gradient(circle at 50% 30%, rgba(40,80,160,0.18), rgba(2,4,12,0) 60%),
              linear-gradient(180deg, rgba(4,6,15,0.55), rgba(4,6,15,0.85));
  opacity: 0; pointer-events: none; visibility: hidden;
  transition: opacity .45s ease, transform .45s ease, visibility .45s;
  transform: scale(0.98);
  overflow-y: auto;
}
.screen.show { opacity: 1; pointer-events: auto; visibility: visible; transform: scale(1); }
.screen::-webkit-scrollbar { width: 6px; }
.screen::-webkit-scrollbar-thumb { background: var(--panel-bd); border-radius: 3px; }

/* ---------- 标题 ---------- */
.game-title {
  font-weight: 800; letter-spacing: 4px; font-size: clamp(34px, 6vw, 64px);
  color: #fff; text-align: center; line-height: 1.05;
  text-shadow: 0 0 18px rgba(58,209,255,.7), 0 0 40px rgba(192,107,255,.5);
}
.game-title .sub {
  display: block; font-size: 0.42em; letter-spacing: 10px; margin-top: 8px;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--magenta));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: hueShift 8s linear infinite;
}
.game-title.big { animation: titleFloat 5s ease-in-out infinite; }
.game-tagline { color: var(--cyan-soft); letter-spacing: 3px; font-size: 14px; opacity: .85; }
.screen-title {
  font-weight: 700; letter-spacing: 3px; font-size: clamp(24px, 4vw, 36px);
  color: var(--cyan-soft); text-shadow: 0 0 14px rgba(58,209,255,.6); text-align: center;
}
.screen-title .ach-count { font-size: 0.5em; color: var(--gold); margin-left: 10px; }

@keyframes hueShift { to { filter: hue-rotate(360deg); } }
@keyframes titleFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* ---------- 按钮 ---------- */
.menu-btns { display: flex; flex-direction: column; gap: 14px; width: min(320px, 80vw); }
.tg-btn {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 12px 22px; border-radius: 8px; cursor: pointer; overflow: hidden;
  color: var(--text); font-family: inherit;
  background: linear-gradient(100deg, rgba(20,40,80,.85), rgba(10,16,34,.85));
  border: 1px solid var(--panel-bd);
  box-shadow: inset 0 0 12px rgba(58,209,255,.12), 0 4px 18px rgba(0,0,0,.4);
  transition: transform .18s ease, box-shadow .18s, border-color .18s;
}
.tg-btn::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--cyan), var(--purple));
  box-shadow: 0 0 10px var(--cyan);
}
.tg-btn-label { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
.tg-btn-sub { font-size: 10px; letter-spacing: 4px; color: var(--text-dim); }
.tg-btn:hover { transform: translateX(6px); border-color: var(--cyan); box-shadow: 0 0 20px rgba(58,209,255,.35), inset 0 0 16px rgba(58,209,255,.18); }
.tg-btn:active { transform: translateX(3px) scale(.99); }

.screen-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.screen-actions .tg-btn { min-width: 130px; align-items: center; }

.menu-bg-glow { position: absolute; width: 70vw; height: 70vw; max-width: 700px; max-height: 700px;
  border-radius: 50%; background: radial-gradient(circle, rgba(58,209,255,.12), transparent 60%);
  filter: blur(8px); animation: pulse 6s ease-in-out infinite; pointer-events: none; z-index: -1; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.12); opacity: 1; } }
/* ---------- 流星动画层（仅主菜单） ---------- */
.meteor-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }

/* 单颗流星：细线 + 渐变拖尾 + 发光头部 */
.meteor {
  position: absolute;
  width: 160px; height: 2px;
  background: linear-gradient(to right, transparent, rgba(58,209,255,.15) 20%, rgba(155,246,255,.6) 65%, rgba(255,255,255,.95) 100%);
  border-radius: 2px;
  opacity: 0;
  filter: drop-shadow(0 0 4px rgba(155,246,255,.5));
}
/* 流星头部光点 */
.meteor::after {
  content: ""; position: absolute; right: -1px; top: 50%;
  transform: translateY(-50%);
  width: 5px; height: 5px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px 2px rgba(155,246,255,.8), 0 0 18px 4px rgba(58,209,255,.3);
}
/* 流星划过动画：沿旋转方向平移，淡入淡出 */
@keyframes meteorStreak {
  0%   { opacity: 0; transform: rotate(var(--rot)) translateX(0); }
  8%   { opacity: 1; }
  85%  { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--rot)) translateX(var(--dist)); }
}

.menu-foot { position: absolute; bottom: 24px; color: var(--text-dim); font-size: 13px; letter-spacing: 1px; }

/* ---------- Loading ---------- */
.load-wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.load-ring { width: 86px; height: 86px; border-radius: 50%;
  border: 4px solid rgba(58,209,255,.15); border-top-color: var(--cyan); border-right-color: var(--purple);
  animation: spin 1s linear infinite; box-shadow: 0 0 24px rgba(58,209,255,.4); }
@keyframes spin { to { transform: rotate(360deg); } }
.load-bar { width: min(320px, 70vw); height: 8px; background: rgba(20,40,80,.6); border-radius: 4px; overflow: hidden; border: 1px solid var(--panel-bd); }
.load-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--purple)); box-shadow: 0 0 12px var(--cyan); transition: width .3s; }
.load-tip { color: var(--cyan-soft); letter-spacing: 2px; font-size: 13px; }

/* ---------- 角色选择卡片 ---------- */
.char-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; width: min(900px, 94vw); }
.char-card {
  position: relative; padding: 18px 16px 16px; border-radius: 14px; cursor: pointer;
  background: linear-gradient(160deg, rgba(18,30,55,.9), rgba(8,12,26,.9));
  border: 1px solid var(--panel-bd); text-align: center;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.char-card::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%); opacity: 0; transition: opacity .3s; }
.char-card:hover { transform: translateY(-6px); border-color: var(--cc); box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 18px var(--cc); }
.char-card:hover::after { opacity: 1; }
.char-card.selected { border-color: var(--cc); box-shadow: 0 0 0 2px var(--cc), 0 0 26px var(--cc); }
.char-avatar { display: flex; justify-content: center; margin-bottom: 6px; }
.char-avatar canvas { background: radial-gradient(circle, rgba(58,209,255,.08), transparent 70%); border-radius: 10px; }
.char-card h3 { font-size: 20px; color: var(--cc); text-shadow: 0 0 10px var(--cc); }
.char-title { color: var(--text-dim); font-size: 11px; letter-spacing: 1px; margin: 2px 0 8px; }
.char-tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 10px; letter-spacing: 2px;
  background: rgba(58,209,255,.12); border: 1px solid var(--cc); color: var(--cc); margin-bottom: 10px; }
.char-stats { text-align: left; display: flex; flex-direction: column; gap: 5px; margin: 8px 0; }
.stat { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
.stat span { width: 36px; }
.stat .bar { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; border-radius: 3px; box-shadow: 0 0 6px currentColor; }
.char-desc { font-size: 11px; color: var(--text-dim); line-height: 1.5; margin-top: 6px; min-height: 32px; }

/* ---------- 关卡选择 ---------- */
.level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; width: min(900px, 94vw); }
.level-card { padding: 0 0 16px; border-radius: 14px; cursor: pointer; overflow: hidden; text-align: center;
  background: linear-gradient(160deg, rgba(18,30,55,.9), rgba(8,12,26,.9)); border: 1px solid var(--panel-bd);
  transition: transform .2s, box-shadow .2s, border-color .2s; }
.level-card:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 8px 28px rgba(0,0,0,.5), 0 0 16px var(--cyan); }
.level-card.selected { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan), 0 0 22px var(--cyan); }
.level-thumb { position: relative; }
.level-thumb canvas { display: block; width: 100%; }
.level-tag { position: absolute; top: 6px; right: 8px; color: var(--gold); font-size: 12px; text-shadow: 0 0 8px var(--gold); }
.level-card h3 { font-size: 18px; color: var(--cyan-soft); margin: 8px 0 4px; }
.level-card p { font-size: 11px; color: var(--text-dim); padding: 0 14px; line-height: 1.5; }

/* ---------- 设置 ---------- */
.settings { display: flex; flex-direction: column; gap: 16px; width: min(360px, 88vw); }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px;
  background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 8px; }
.set-row span { letter-spacing: 2px; }
.set-row input[type=range] { width: 180px; accent-color: var(--cyan); }
.switch { position: relative; width: 46px; height: 24px; display: inline-block; }
.switch input { display: none; }
.switch i { position: absolute; inset: 0; background: rgba(255,255,255,.12); border-radius: 12px; transition: .2s; border: 1px solid var(--panel-bd); }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #cfe; transition: .2s; box-shadow: 0 0 8px rgba(0,0,0,.5); }
.switch input:checked + i { background: rgba(58,209,255,.35); border-color: var(--cyan); }
.switch input:checked + i::after { left: 24px; background: var(--cyan-soft); box-shadow: 0 0 10px var(--cyan); }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; z-index: 5; }
.hud.show { opacity: 1; }
.hud-top, .hud-bot { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 18px; padding: 12px 18px; }
.hud-top { top: 0; justify-content: space-between; }
.hud-bot { bottom: 0; flex-wrap: wrap; justify-content: space-between; }
.hud-top > div { display: flex; flex-direction: column; gap: 3px; }
.hud-top span { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); }
.hud-top b { font-size: 20px; color: var(--cyan-soft); text-shadow: 0 0 8px rgba(58,209,255,.6); }
.hud-best b { color: var(--gold); text-shadow: 0 0 8px var(--gold); }
.hud-tension { min-width: 160px; }
.t-bar { width: 160px; height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; border: 1px solid var(--panel-bd); }
.t-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--gold), var(--magenta)); transition: width .3s; }

/* 双人 HUD 玩家区块 */
.hud-player-block { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
.hud-player-block.p2 { display: none; } /* 默认隐藏 P2，双人模式时由 JS 显示 */
.hud-player-label { font-size: 14px; font-weight: 800; letter-spacing: 2px; color: var(--cyan);
  padding: 4px 8px; border: 1px solid var(--cyan); border-radius: 6px; text-shadow: 0 0 8px var(--cyan); }
.hud-player-block.p2 .hud-player-label { color: var(--magenta); border-color: var(--magenta); text-shadow: 0 0 8px var(--magenta); }
.hud-hp { display: flex; flex-direction: column; gap: 3px; }
.hud-hp span { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); }

.hp-bar { position: relative; width: 220px; height: 18px; background: rgba(255,255,255,.08); border-radius: 9px; overflow: hidden; border: 1px solid var(--panel-bd); }
.hp-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--magenta), var(--gold), var(--green)); transition: width .2s; }
.hp-bar small { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; text-shadow: 0 0 4px #000; }

.hud-skills { display: flex; gap: 10px; pointer-events: auto; }
.skill { position: relative; width: 60px; height: 60px; border-radius: 10px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--panel-bd); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: border-color .2s, box-shadow .2s; overflow: hidden; }
.skill:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(58,209,255,.4); }
.skill .sk-key { position: absolute; top: 2px; left: 5px; font-size: 10px; color: var(--gold); }
.skill .sk-name { font-size: 11px; color: var(--cyan-soft); letter-spacing: 1px; }
.skill .sk-cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.65); transition: height .1s linear; }
.skill.cooling { border-color: rgba(120,120,140,.5); }
.skill.cooling .sk-name { color: var(--text-dim); }
.skill.active { border-color: var(--cyan); box-shadow: 0 0 18px var(--cyan); animation: skillPulse 1s ease-in-out infinite; }
@keyframes skillPulse { 50% { box-shadow: 0 0 26px var(--cyan); } }

.hud-combo { position: absolute; right: 18px; bottom: 90px; font-size: 26px; font-weight: 800; color: var(--gold);
  text-shadow: 0 0 14px var(--gold); opacity: 0; transition: opacity .2s; letter-spacing: 2px; }

/* ---------- 提示条 / 成就弹窗 ---------- */
.toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%) translateY(-10px);
  padding: 8px 18px; background: var(--panel); border: 1px solid var(--cyan); border-radius: 20px;
  color: var(--cyan-soft); font-size: 13px; letter-spacing: 1px; opacity: 0; pointer-events: none;
  box-shadow: 0 0 16px rgba(58,209,255,.3); transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.ach-toast { position: absolute; top: 90px; right: 18px; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: linear-gradient(120deg, rgba(40,28,10,.92), rgba(20,12,30,.92));
  border: 1px solid var(--gold); border-radius: 12px; box-shadow: 0 0 22px rgba(255,210,74,.35);
  opacity: 0; transform: translateX(120%); transition: opacity .4s, transform .4s; pointer-events: none; max-width: 280px; }
.ach-toast.show { opacity: 1; transform: translateX(0); }
.ach-toast-ico { font-size: 30px; color: var(--gold); text-shadow: 0 0 12px var(--gold); }
.ach-toast b { font-size: 12px; color: var(--gold); letter-spacing: 2px; }
.ach-toast p { font-size: 15px; color: #fff; }
.ach-toast small { font-size: 10px; color: var(--text-dim); }

/* ---------- 确认框 ---------- */
.confirm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(2,4,12,.6); opacity: 0; pointer-events: none; backdrop-filter: blur(3px); transition: opacity .25s; z-index: 30; }
.confirm.show { opacity: 1; pointer-events: auto; }
.confirm-box { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 36px;
  background: var(--panel); border: 1px solid var(--magenta); border-radius: 14px; box-shadow: 0 0 30px rgba(255,58,107,.35); }
.confirm-box h3 { font-size: 18px; color: #fff; text-align: center; }
.confirm-btns { display: flex; gap: 14px; }

/* ---------- Boss 出场 CG ---------- */
.boss-cg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; z-index: 20; }
.boss-cg.show { opacity: 1; animation: bcgShow 2.6s ease forwards; }
@keyframes bcgShow { 0% { opacity: 0; } 8% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.boss-cg-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,58,107,.5), transparent 60%); animation: bcgFlash .5s ease-out 2; }
@keyframes bcgFlash { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
.boss-cg-lines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 8px, rgba(255,58,107,.06) 8px 9px); animation: bcgLines 1.2s linear infinite; }
@keyframes bcgLines { to { transform: translateY(9px); } }
.boss-cg-text { text-align: center; position: relative; }
.bcg-warn { color: var(--magenta); letter-spacing: 6px; font-size: 18px; animation: bcgBlink .5s steps(2) infinite; }
@keyframes bcgBlink { 50% { opacity: .3; } }
.bcg-name { font-size: clamp(40px, 8vw, 84px); font-weight: 900; letter-spacing: 6px; color: #fff;
  text-shadow: 0 0 24px var(--magenta), 0 0 60px var(--purple); animation: bcgZoom 2.6s ease; }
.bcg-title { color: var(--cyan-soft); letter-spacing: 4px; font-size: 16px; margin-top: 8px; }
@keyframes bcgZoom { 0% { transform: scale(2.4); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

/* ---------- 结算 ---------- */
.res-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(560px, 92vw); }
.res-banner { font-size: clamp(38px, 7vw, 64px); font-weight: 900; letter-spacing: 8px; animation: resIn .6s ease; }
.res-banner.win { color: var(--green); text-shadow: 0 0 24px var(--green), 0 0 50px var(--cyan); }
.res-banner.lose { color: var(--magenta); text-shadow: 0 0 24px var(--magenta); }
@keyframes resIn { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.res-stats > div { display: flex; flex-direction: column; gap: 4px; align-items: center; padding: 10px;
  background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 8px; }
.res-stats span { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }
.res-stats b { font-size: 22px; color: var(--cyan-soft); }
.res-ach { width: 100%; }
.res-ach h4 { color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
.res-ach-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--gold);
  border-radius: 8px; margin-bottom: 6px; animation: resIn .5s ease; }
.res-ach-item .ach-ico { font-size: 24px; color: var(--gold); }
.res-ach-item b { color: #fff; } .res-ach-item small { color: var(--text-dim); font-size: 11px; }

/* ---------- 勋章展馆 ---------- */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; width: min(900px, 94vw); }
.ach-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--panel-bd); transition: transform .2s, box-shadow .2s; }
.ach-card:hover { transform: translateY(-3px); }
.ach-card.got { border-color: var(--gold); box-shadow: 0 0 16px rgba(255,210,74,.25); }
.ach-card.locked { opacity: .5; }
.ach-ico { font-size: 30px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,210,74,.12); color: var(--gold); text-shadow: 0 0 10px var(--gold); }
.ach-ico.lock { color: var(--text-dim); background: rgba(255,255,255,.05); text-shadow: none; }
.ach-info b { font-size: 15px; color: #fff; }
.ach-info p { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
.ach-info small { font-size: 10px; color: var(--gold); }

/* ---------- 响应式 ---------- */
@media (max-width: 600px) {
  .hud-top, .hud-bot { gap: 10px; padding: 8px; }
  .hud-tension, .t-bar { min-width: 100px; width: 100px; }
  .hp-bar { width: 150px; }
  .skill { width: 50px; height: 50px; }
  .res-stats { grid-template-columns: repeat(2, 1fr); }
  .mode-grid { grid-template-columns: 1fr !important; }

<canvas id="game"></canvas>
<div id="ui-root"></div>
<script>

/* ===== utils.js ===== */
/* =====================================================================
 * utils.js — 工具函数：数学运算、随机数、AABB碰撞、向量、对象池
 * 全部挂载到全局命名空间 TG，供其它模块复用
 * ===================================================================== */
(function (TG) {
  'use strict';

  // ----- 数学工具 -----
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist2 = (ax, ay, bx, by) => {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
  // 角度差归一到 -PI..PI
  const angleDiff = (a, b) => {
    let d = (a - b) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  };
  // 朝目标角度平滑转向
  const turnToward = (cur, target, maxStep) => {
    const d = angleDiff(target, cur);
    if (Math.abs(d) <= maxStep) return target;
    return cur + Math.sign(d) * maxStep;
  };

  // ----- AABB 碰撞 -----
  // 两矩形 {x,y,w,h}（左上角+宽高）
  const aabb = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // 圆与矩形碰撞（用于子弹圆形 vs 实体矩形）
  const circleRect = (cx, cy, cr, r) => {
    const nx = clamp(cx, r.x, r.x + r.w);
    const ny = clamp(cy, r.y, r.y + r.h);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= cr * cr;
  };

  // ----- 对象池 -----
  // 预分配 + 复用，避免高频 GC 抖动（子弹/粒子/敌人）
  class Pool {
    constructor(factory, reset, pre = 0) {
      this.factory = factory;
      this.reset = reset;
      this.free = [];
      this.active = [];
      for (let i = 0; i < pre; i++) this.free.push(factory());
    }
    acquire() {
      const o = this.free.pop() || this.factory();
      this.active.push(o);
      return o;
    }
    release(o) {
      const i = this.active.indexOf(o);
      if (i >= 0) {
        this.active.splice(i, 1);
        if (this.reset) this.reset(o);
        this.free.push(o);
      }
    }
    // 每帧回收标记为 dead 的对象
    sweep(getDead) {
      for (let i = this.active.length - 1; i >= 0; i--) {
        const o = this.active[i];
        if (getDead(o)) this.release(o);
      }
    }
    forEach(fn) {
      for (let i = 0; i < this.active.length; i++) fn(this.active[i], i);
    }
    clear() {
      while (this.active.length) this.release(this.active[0]);
    }
  }

  // ----- localStorage 封装（容错） -----
  const store = {
    get(key, def) {
      try {
        const v = localStorage.getItem(key);
        return v == null ? def : JSON.parse(v);
      } catch (e) { return def; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    },
  };

  // ----- 简易事件计时器：到时回调一次 -----
  class Timer {
    constructor() { this.t = 0; this.cb = null; this.active = false; }
    set(sec, cb) { this.t = sec; this.cb = cb; this.active = true; }
    update(dt) {
      if (!this.active) return;
      this.t -= dt;
      if (this.t <= 0) { this.active = false; const c = this.cb; this.cb = null; if (c) c(); }
    }
    clear() { this.active = false; this.cb = null; }
  }

  // 导出
  Object.assign(TG, {
    TAU, clamp, lerp, rand, randInt, pick, dist, dist2, angleDiff, turnToward,
    aabb, circleRect, Pool, store, Timer,
  });
})(window.TG = window.TG || {});


/* ===== audio.js ===== */
/* =====================================================================
 * audio.js — 程序化音频引擎（Web Audio API）
 *   - 多阶段 BGM：主菜单 / 轻松战斗 / 紧张战斗 / Boss战 / 胜利 / 失败
 *   - 音效 SFX：射击 / 命中 / 爆炸 / 拾取 / 受击 / 清屏 / 升级 / 点击 等
 *   - 全部用振荡器+包络+滤波器合成，零外部音频文件
 * ===================================================================== */
(function (TG) {
  'use strict';

  class AudioEngine {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.musicGain = null;
      this.sfxGain = null;
      this.enabled = true;
      this.musicOn = true;
      this.sfxOn = true;
      this.curTrack = null;     // 当前曲目 id
      this.seqTimer = null;     // setTimeout 句柄
      this.step = 0;            // 序列步进
      this.bpm = 120;
      this.layer2 = false;      // 是否叠加紧张层
      this.volume = 0.7;
    }

    // 用户首次交互后才可创建 AudioContext（浏览器策略）
    init() {
      if (this.ctx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.volume;
        this.master.connect(this.ctx.destination);
        this.musicGain = this.ctx.createGain();
        this.musicGain.gain.value = 0.42;
        this.musicGain.connect(this.master);
        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.55;
        this.sfxGain.connect(this.master);
      } catch (e) { this.enabled = false; }
    }

    resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }

    setVolume(v) {
      this.volume = TG.clamp(v, 0, 1);
      if (this.master) this.master.gain.value = this.volume;
    }

    // ---- 单音合成 ----
    // type: 振荡器类型；freq；dur；gain；attack/decay；可选 glide 目标频率
    tone({ freq = 440, type = 'sine', dur = 0.2, gain = 0.2, attack = 0.005,
           decay = null, glide = null, dest = null, when = 0, detune = 0 }) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + when;
      const osc = this.ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (glide != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, glide), t + dur);
      osc.detune.value = detune;
      const g = this.ctx.createGain();
      const d = decay != null ? decay : dur;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + d);
      osc.connect(g);
      g.connect(dest || this.sfxGain);
      osc.start(t);
      osc.stop(t + attack + d + 0.02);
    }

    // 噪声爆（爆炸/受击）
    noise({ dur = 0.3, gain = 0.3, type = 'highpass', freq = 800, q = 1, when = 0 }) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + when;
      const len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const filt = this.ctx.createBiquadFilter();
      filt.type = type; filt.frequency.value = freq; filt.Q.value = q;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filt); filt.connect(g); g.connect(this.sfxGain);
      src.start(t);
    }

    // ============== SFX 库 ==============
    sfxShoot() { this.tone({ freq: 720, type: 'square', dur: 0.08, gain: 0.12, glide: 240 }); this.noise({ dur: 0.05, gain: 0.05, freq: 1800 }); }
    sfxEnemyShoot() { this.tone({ freq: 300, type: 'sawtooth', dur: 0.1, gain: 0.06, glide: 160 }); }
    sfxHit() { this.tone({ freq: 420, type: 'triangle', dur: 0.07, gain: 0.12, glide: 620 }); this.noise({ dur: 0.06, gain: 0.08, freq: 2400 }); }
    sfxExplosion() { this.noise({ dur: 0.45, gain: 0.32, type: 'lowpass', freq: 900, q: 0.6 }); this.tone({ freq: 120, type: 'sine', dur: 0.35, gain: 0.18, glide: 40 }); }
    sfxBigExplosion() { this.noise({ dur: 0.9, gain: 0.42, type: 'lowpass', freq: 700, q: 0.5 }); this.tone({ freq: 90, type: 'sine', dur: 0.8, gain: 0.28, glide: 30 }); for (let i = 0; i < 3; i++) this.tone({ freq: 200 + i * 120, type: 'square', dur: 0.3, gain: 0.1, glide: 60, when: i * 0.08 }); }
    sfxPickup() { this.tone({ freq: 660, dur: 0.08, gain: 0.14, type: 'triangle' }); this.tone({ freq: 990, dur: 0.1, gain: 0.12, type: 'triangle', when: 0.08 }); }
    sfxHurt() { this.noise({ dur: 0.2, gain: 0.25, type: 'bandpass', freq: 500, q: 1.5 }); this.tone({ freq: 220, type: 'sawtooth', dur: 0.18, gain: 0.14, glide: 90 }); }
    sfxShield() { this.tone({ freq: 200, type: 'sine', dur: 0.4, gain: 0.16, glide: 900 }); this.tone({ freq: 600, type: 'triangle', dur: 0.4, gain: 0.1, glide: 1400 }); }
    sfxClear() { for (let i = 0; i < 6; i++) this.tone({ freq: 300 + i * 180, type: 'sawtooth', dur: 0.18, gain: 0.1, glide: 1200, when: i * 0.03 }); this.noise({ dur: 0.5, gain: 0.2, type: 'highpass', freq: 1000 }); }
    sfxUpgrade() { const n = [523, 659, 784, 1047]; n.forEach((f, i) => this.tone({ freq: f, type: 'triangle', dur: 0.16, gain: 0.12, when: i * 0.07 })); }
    sfxClick() { this.tone({ freq: 880, type: 'square', dur: 0.04, gain: 0.08 }); }
    sfxHover() { this.tone({ freq: 1200, type: 'sine', dur: 0.03, gain: 0.04 }); }
    sfxAchievement() { const n = [784, 988, 1175, 1568]; n.forEach((f, i) => this.tone({ freq: f, type: 'triangle', dur: 0.22, gain: 0.12, when: i * 0.09 })); }
    sfxBossRoar() { this.tone({ freq: 80, type: 'sawtooth', dur: 1.2, gain: 0.3, glide: 50 }); this.noise({ dur: 1.2, gain: 0.25, type: 'lowpass', freq: 400, q: 0.7 }); this.tone({ freq: 120, type: 'square', dur: 0.8, gain: 0.16, glide: 60, when: 0.1 }); }
    sfxWarning() { for (let i = 0; i < 4; i++) this.tone({ freq: 880, type: 'square', dur: 0.12, gain: 0.12, when: i * 0.18 }); }

    // ============== BGM 引擎 ==============
    // 每首曲目定义：根音、调式音阶、bass 线、和弦、旋律模板、bpm、音色
    static SCALES = {
      minor: [0, 2, 3, 5, 7, 8, 10],
      major: [0, 2, 4, 5, 7, 9, 11],
      phrygian: [0, 1, 3, 5, 7, 8, 10],
      pentMin: [0, 3, 5, 7, 10],
    };
    static TRACKS = {
      menu:    { root: 55,  scale: 'major',   bpm: 92,  bass: [0, 7, 5, 10], chords: [[0,4,7],[5,9,12],[7,11,14],[10,14,17]], mel: [0,4,7,9,7,4,2,0], wave: 'triangle', tense: false },
      calm:    { root: 49,  scale: 'pentMin',  bpm: 104, bass: [0, 7, 3, 10], chords: [[0,3,7],[7,10,14],[3,7,10],[10,14,17]], mel: [0,3,5,7,10,7,5,3], wave: 'sawtooth', tense: false },
      tense:   { root: 41,  scale: 'minor',    bpm: 138, bass: [0, 7, 3, 8],  chords: [[0,3,7],[8,11,15],[3,7,10],[10,13,17]], mel: [0,3,5,7,3,0,10,7], wave: 'square', tense: true },
      boss:    { root: 33,  scale: 'phrygian', bpm: 150, bass: [0, 1, 0, 1], chords: [[0,3,7],[1,4,8],[0,3,7],[1,4,8]], mel: [0,1,3,1,0,10,8,7], wave: 'sawtooth', tense: true },
      victory: { root: 60,  scale: 'major',    bpm: 120, bass: [0, 7, 9, 12], chords: [[0,4,7],[7,11,14],[9,12,16],[12,16,19]], mel: [0,4,7,12,11,9,7,4], wave: 'triangle', tense: false },
      defeat:  { root: 44,  scale: 'minor',    bpm: 70,  bass: [0, 0, 5, 4],   chords: [[0,3,7],[0,3,7],[5,8,12],[4,7,11]], mel: [0,3,7,3,0,10,8,7], wave: 'sine', tense: false },
    };

    playMusic(id, crossfade = 0.8) {
      if (!this.ctx || !this.enabled || !this.musicOn) return;
      if (this.curTrack === id) return;        // 同曲目不重复启动
      this._stopScheduler();
      if (this.musicGain && this.ctx) this.musicGain.gain.value = 0.42;
      this.curTrack = id;
      this.layer2 = false;
      const tr = AudioEngine.TRACKS[id];
      if (!tr) return;
      this.bpm = tr.bpm;
      this.step = 0;
      this._schedLoop(id, tr);
    }

    // 切换是否叠加紧张层（同一曲目叠加高音节奏层）
    setTenseLayer(on) {
      if (this.layer2 === on) return;
      this.layer2 = on;
    }

    _stopScheduler() {
      if (this.seqTimer) { clearTimeout(this.seqTimer); this.seqTimer = null; }
    }

    stopMusic(fade = 0.6) {
      this._stopScheduler();
      this.curTrack = null;
      if (this.musicGain && this.ctx) {
        const t = this.ctx.currentTime;
        this.musicGain.gain.cancelScheduledValues(t);
        this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, t);
        this.musicGain.gain.linearRampToValueAtTime(0.0001, t + fade);
      }
    }

    // 一个 16 步循环：bass + 和弦垫 + 旋律；trackId 用于校验是否仍在播放该曲
    _schedLoop(trackId, tr) {
      const beat = 60 / this.bpm / 2;          // 八分音符时长
      const scale = AudioEngine.SCALES[tr.scale];
      const noteFreq = (semi) => 440 * Math.pow(2, (tr.root + semi - 69) / 12);

      const tick = () => {
        if (this.curTrack !== trackId) return;  // 曲目已切换/停止则退出循环
        const s = this.step % 16;
        // 低音
        if (s % 4 === 0) {
          const bi = (s / 4) | 0;
          this.tone({ freq: noteFreq(tr.bass[bi % tr.bass.length]), type: 'sine', dur: beat * 3, gain: 0.16, attack: 0.01, dest: this.musicGain });
        }
        // 和弦垫（每 8 步换和弦）
        if (s % 8 === 0) {
          const ci = (s / 8) | 0;
          const ch = tr.chords[ci % tr.chords.length];
          ch.forEach((semi) => this.tone({ freq: noteFreq(semi + 12), type: 'sine', dur: beat * 7, gain: 0.05, attack: 0.06, dest: this.musicGain }));
        }
        // 旋律（偶数步）
        if (s % 2 === 0) {
          const mi = (s / 2) | 0;
          const semi = tr.mel[mi % tr.mel.length];
          const octave = tr.tense ? 12 : 0;
          this.tone({ freq: noteFreq(scale[semi % scale.length] + 24 + octave), type: tr.wave, dur: beat * 1.6, gain: 0.1, dest: this.musicGain });
          if (this.layer2) {
            // 紧张节奏层：短促高音脉冲
            this.tone({ freq: noteFreq(scale[semi % scale.length] + 36), type: 'square', dur: 0.06, gain: 0.06, dest: this.musicGain });
          }
        }
        // 紧张层打击（hi-hat 噪声）
        if (this.layer2 && s % 2 === 1) {
          this.noise({ dur: 0.03, gain: 0.04, type: 'highpass', freq: 6000 });
        }
        this.step++;
        this.seqTimer = setTimeout(tick, beat * 1000);
      };
      tick();
    }
  }

  TG.AudioEngine = AudioEngine;
  TG.audio = new AudioEngine();
})(window.TG = window.TG || {});


/* ===== particle.js ===== */
/* =====================================================================
 * particle.js — 粒子系统
 *   类型：爆炸碎片 / 子弹拖尾 / 命中闪光 / 拾取光环 / 护盾环 / 引擎尾焰
 *   单例 ParticleSystem 统一管理 update+render，复用对象池
 * ===================================================================== */
(function (TG) {
  'use strict';

  class Particle {
    constructor() { this.alive = false; }
    spawn(x, y, vx, vy, life, color, size, type, extra) {
      this.alive = true;
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.life = life; this.max = life;
      this.color = color; this.size = size; this.type = type;
      this.extra = extra || {};
      this.rot = Math.random() * TG.TAU;
      this.vr = TG.rand(-6, 6);
    }
    update(dt) {
      if (!this.alive) return;
      this.life -= dt;
      if (this.life <= 0) { this.alive = false; return; }
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= 0.96; this.vy *= 0.96;
      if (this.extra.gravity) this.vy += this.extra.gravity * dt;
      this.rot += this.vr * dt;
    }

(function (TG) {

  class Bullet {

      this.px = x; this.py = y;          // 上一帧位置（用于拖尾/穿透）
      this.vx = vx; this.vy = vy;
      this.team = team;                  // 阵营
      this.dmg = dmg;
      this.r = (opts && opts.r) || 4;    // 半径（用于碰撞）
      this.life = (opts && opts.life) || 2.5;
      this.color = (opts && opts.color) || (team === 'player' ? '#9bf6ff' : '#ff6bd6');
      this.pierce = (opts && opts.pierce) || 0;   // 穿透剩余次数（0=命中即销毁）
      this.homing = (opts && opts.homing) || 0;   // 追踪强度
      this.target = (opts && opts.target) || null;
      this.shape = (opts && opts.shape) || 'round';
      this.spin = 0;
      this.trailT = 0;
    }
    update(dt, game) {
      if (!this.alive) return;
      this.px = this.x; this.py = this.y;
      // 追踪
      if (this.homing && this.target && this.target.alive) {
        const want = Math.atan2(this.target.cy - this.y, this.target.cx - this.x);
        const cur = Math.atan2(this.vy, this.vx);
        const na = TG.turnToward(cur, want, this.homing * dt);
        const sp = Math.hypot(this.vx, this.vy);
        this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
      }
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.spin += dt * 8;

        this.alive = false; return;

      this.trailT -= dt;
      if (this.trailT <= 0) {
        TG.particles.trail(this.x, this.y, this.vx, this.vy, this.color, this.r * 0.7);
        this.trailT = 0.02;

        ctx.fillStyle = c;
        ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.arc(0, 0, this.r * 1.7, 0, TG.TAU); ctx.fill();
        ctx.globalAlpha = 1;
      } else { // 'bolt' 闪电长条
        ctx.fillStyle = c;
        ctx.fillRect(-this.r * 2.2, -this.r * 0.5, this.r * 4.4, this.r);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-this.r * 1.6, -this.r * 0.25, this.r * 3.2, this.r * 0.5);
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    // 碰撞盒（圆）
    hitCircle() { return { x: this.x, y: this.y, r: this.r }; }
  }

    constructor() {
      this.pool = new TG.Pool(() => new Bullet(), (b) => { b.alive = false; }, 120);
    }

      b.spawn(x, y, Math.cos(ang) * speed, Math.sin(ang) * speed, team, dmg, opts);

    }

    update(dt, game) {
      this.pool.forEach((b) => b.update(dt, game));
      this.pool.sweep((b) => !b.alive);
    }
    render(ctx) { this.pool.forEach((b) => b.render(ctx)); }
    forEach(fn) { this.pool.forEach(fn); }
  }

  TG.bullets = new BulletSystem();

            const d = Math.hypot(dx, dy) || 1;
            if (d < this.kiteDist * 0.7) {
              // 玩家逼近 → 快速后撤
              this.cx -= (dx / d) * sp * 1.3;
              this.cy -= (dy / d) * sp * 1.3;
            } else if (d > this.kiteDist * 1.5) {
              // 太远 → 缓慢靠拢
              this.cx += (dx / d) * sp * 0.4;
              this.cy += (dy / d) * sp * 0.4;
            }
            // 偏好在屏幕上半区域
            if (this.cy > game.H * 0.45) this.cy -= sp * 0.5;
            this.ang = Math.atan2(dy, dx);
          } else {
            this.cy += sp * 0.5;
          }
          break;

        case 'zigzag':
          // 普通兵：之字形推进
          this.cy += sp * 0.85;
          this.cx += Math.sin(this.t * 3 + this.phase) * sp * 1.2;
          this.ang = Math.PI / 2 + Math.sin(this.t * 3) * 0.4;
          break;

        case 'arc':
          // 普通兵：弧线包抄（侧向+向下）
          {
            const dir = this.phase < Math.PI ? 1 : -1;
            this.cy += sp * 0.65;
            this.cx += dir * (sp * 0.55 + Math.cos(this.t * 1.5) * sp * 0.3);
            this.ang = Math.PI / 2 + dir * 0.5;
          }
          break;

        case 'pause-charge':
          // 普通兵：间歇停顿再冲刺
          if (this.pauseT > 0) {
            this.pauseT -= dt;
            this.cx += Math.sin(this.t * 4) * sp * 0.15; // 停顿时微抖
          } else if (this.chargeT > 0) {
            this.chargeT -= dt;
            this.cy += sp * 2.6;                          // 快速冲刺
          } else {
            // 随机切换停顿/冲刺
            if (Math.random() < 0.015) this.pauseT = TG.rand(0.5, 1.2);
            else this.chargeT = TG.rand(0.3, 0.6);
            this.cy += sp * 0.3;                          // 慢速漂流
          }
          this.ang = Math.PI / 2;
          break;

        case 'sine':
          // 普通兵：正弦波
          this.cy += sp;
          this.cx = this.baseX + Math.sin(this.t * 2.5 + this.phase) * 60;
          this.ang = Math.PI / 2;
          break;

        case 'orbit':
          // 普通兵：盘旋
          this.cx += Math.cos(this.t * 1.4 + this.phase) * sp;
          this.cy += Math.sin(this.t * 1.4) * 0.4 * sp + sp * 0.5;
          this.ang = Math.atan2(Math.sin(this.t * 1.4), Math.cos(this.t * 1.4 + this.phase));
          break;

        default:
          // 直线推进
          this.cy += sp;
          this.ang = Math.PI / 2;
      }

      // 轻微呼吸抖动（让走位更生动，不影响性能）
      this.cx += Math.sin(this.t * 3 + this.phase) * 0.4;
      this.cy += Math.cos(this.t * 2.5 + this.phase) * 0.4;

      // 简单分离：避免完全重叠扎堆
      this._separate(dt);

      // 边界：左右回弹，越下方消失并扣分提示
      if (this.cx < this.r) { this.cx = this.r; this.baseX = this.r; }
      if (this.cx > game.W - this.r) { this.cx = game.W - this.r; this.baseX = game.W - this.r; }
      if (this.cy > game.H + 40) { this.alive = false; return; }

      // 射击
      this.fireT -= dt;
      if (this.fireT <= 0 && p && this.cy < game.H - 30) {
        this.shoot(game);
        this.fireT = this.fireCd;
      }
    }

    shoot(game) {
      const p = game.player;
      let ang = Math.PI / 2;
      if (this.aimed && p) ang = Math.atan2(p.cy - this.cy, p.cx - this.cx);
      const ox = this.cx + Math.cos(this.ang) * (this.r + 4);
      const oy = this.cy + Math.sin(this.ang) * (this.r + 4);
      const opts = { color: this.color, r: 4, life: 3, homing: this.homing };
      if (this.type === 'elite') {
        // 三连扇形
        for (let i = -1; i <= 1; i++) {
          TG.bullets.fire(ox, oy, ang + i * 0.22, this.bSpeed, 'enemy', this.dmg, opts);
        }
      } else {
        TG.bullets.fire(ox, oy, ang, this.bSpeed, 'enemy', this.dmg, opts);
      }
      TG.audio.sfxEnemyShoot();
    }

    takeDamage(d) {
      // 防御减伤：实际伤害 = max(1, 子弹伤害 − 防御值)
      const actual = Math.max(1, Math.round(d - this.defense));
      this.hp -= actual;
      this.flashT = 0.12;
      TG.particles.hit(this.cx, this.cy, Math.random() * TG.TAU, this.color);
      // 伤害飘字（高伤橙红，普通白色）
      const color = actual >= 15 ? '#ff8a3a' : '#ffffff';
      TG.floatTexts.spawn(this.cx, this.cy - this.r - 4, actual, color);
      if (this.hp <= 0) { this.alive = false; return true; }
      // 受击偶尔嘲讽
      if (Math.random() < 0.18) this.taunt(true);
      return false;
    }

    render(ctx) {
      if (!this.alive) return;
      const scale = 1 - this.entryT / 0.6;  // 入场放大
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.scale(scale, scale);
      ctx.rotate(this.ang + Math.PI / 2);
      if (this.flashT > 0) ctx.globalAlpha = 0.85;
      this._draw(ctx);
      if (this.flashT > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.5;
        this._shape(ctx, 0);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      ctx.restore();

      // 血条
      if (this.hp < this.maxHp) {
        const w = this.r * 2.2, h = 3;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(this.cx - w / 2, this.cy - this.r - 10, w, h);
        ctx.fillStyle = this.hp / this.maxHp > 0.4 ? '#7fff8a' : '#ff5a5a';
        ctx.fillRect(this.cx - w / 2, this.cy - this.r - 10, w * (this.hp / this.maxHp), h);
      }

      // 嘲讽气泡
      if (this.bubbleT > 0 && this.bubble) {
        this._drawBubble(ctx);
      }
    }

    _draw(ctx) {
      ctx.shadowColor = this.color; ctx.shadowBlur = 12;
      ctx.fillStyle = this.color;
      this._shape(ctx, this.r);
      ctx.shadowBlur = 0;
      // 核心
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, this.r * 0.25, 0, TG.TAU); ctx.fill();
    }

    _shape(ctx, r) {
      if (this.type === 'elite') {
        // 菱形精英
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill();
      } else if (this.type === 'sniper') {
        // 六边形
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * TG.TAU - Math.PI / 2;
          (i ? ctx.lineTo : ctx.moveTo).call(ctx, Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath(); ctx.fill();
      } else if (this.type === 'diver') {
        // 三角箭头
        ctx.beginPath();
        ctx.moveTo(0, r); ctx.lineTo(r, -r * 0.7); ctx.lineTo(-r, -r * 0.7); ctx.closePath(); ctx.fill();
      } else {
        // 圆形 grunt
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TG.TAU); ctx.fill();
      }
    }

    _drawBubble(ctx) {
      const txt = this.bubble;
      ctx.font = '13px "Segoe UI", sans-serif';
      const tw = ctx.measureText(txt).width + 16;
      const bx = this.cx - tw / 2, by = this.cy - this.r - 30;
      const a = this.bubbleT > 1.9 ? (2.2 - this.bubbleT) / 0.3 : (this.bubbleT < 0.3 ? this.bubbleT / 0.3 : 1);
      ctx.globalAlpha = TG.clamp(a, 0, 1);
      ctx.fillStyle = 'rgba(12,18,32,0.92)';
      ctx.strokeStyle = this.color; ctx.lineWidth = 1.5;
      this._roundRect(ctx, bx, by, tw, 22, 6); ctx.fill(); ctx.stroke();
      // 小尾巴
      ctx.beginPath();
      ctx.moveTo(this.cx - 4, by + 22); ctx.lineTo(this.cx, by + 28); ctx.lineTo(this.cx + 4, by + 22); ctx.closePath();
      ctx.fillStyle = 'rgba(12,18,32,0.92)'; ctx.fill();
      ctx.fillStyle = '#eaf2ff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, this.cx, by + 11);
      ctx.globalAlpha = 1;
    }
    _roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 简单分离力：避免敌人完全重叠扎堆
    _separate(dt) {
      const minDist = this.r * 2.4;
      let pushX = 0, pushY = 0;
      TG.enemies.forEach((other) => {
        if (other === this || !other.alive) return;
        const dx = this.cx - other.cx;
        const dy = this.cy - other.cy;
        const d = Math.hypot(dx, dy);
        if (d < minDist && d > 0.1) {
          const force = (minDist - d) / minDist * 35;
          pushX += (dx / d) * force * dt;
          pushY += (dy / d) * force * dt;
        }
      });
      this.cx += pushX;
      this.cy += pushY;
    }

    hitCircle() { return { x: this.cx, y: this.cy, r: this.r - 2 }; }
  }

  class EnemySystem {
    constructor() {
      this.pool = new TG.Pool(() => new Enemy(), (e) => { e.alive = false; }, 40);
    }
    clear() { this.pool.clear(); }
    count() { return this.pool.active.length; }
    spawn(type, x, y, tension, game) {
      const e = this.pool.acquire();
      e.spawn(type, x, y, tension, game);
      return e;
    }
    update(dt, game) {
      this.pool.forEach((e) => e.update(dt, game));
      this.pool.sweep((e) => !e.alive);
    }
    render(ctx) { this.pool.forEach((e) => e.render(ctx)); }
    forEach(fn) { this.pool.forEach(fn); }
  }

  TG.Enemy = Enemy;
  TG.enemies = new EnemySystem();
  TG.ENEMY_TYPES = TYPES;
})(window.TG = window.TG || {});


/* ===== boss.js ===== */
/* =====================================================================
 * boss.js — Boss（多阶段状态机）
 *   - 至少 3 阶段，按血量阈值切换
 *   - 每阶段不同攻击模式：螺旋 / 瞄准散射 / 密集弹幕+召唤
 *   - 出场 CG 由 game 控制（震撼登场、镜头推进、名字展示）
 * ===================================================================== */
(function (TG) {
  'use strict';

  // 首 Boss 基础定义（新手友好，后续可用 scale 放大）
  const BOSS_DEF = {
    name: '深渊执政官', title: 'Void Archon · 星际守护者之敌',
    maxHp: 1000, r: 46, color: '#ff3a6b', accent: '#ffb0c8', defense: 5,
    phases: [
      // 首战 2 阶段（移除了原第3阶段"密集弹幕+召唤"）
      { at: 1.0,  mode: 'spiral', fireCd: 0.30, bSpeed: 140, dmg: 6 },  // 原0.16/180/8
      { at: 0.45, mode: 'aimed',  fireCd: 0.35, bSpeed: 200, dmg: 8 },  // 原0.22/260/10 @0.6
    ],
  };

  class Boss {
    constructor(game, scale) {
      this.def = BOSS_DEF;
      this.game = game;
      this.scale = scale || 1.0;                  // 难度缩放（首战=1，高难度可放大）
      this.cx = game.W / 2; this.cy = -80;
      this.r = BOSS_DEF.r;
      this.maxHp = Math.round(BOSS_DEF.maxHp * this.scale);
      this.hp = this.maxHp;
      this.defense = BOSS_DEF.defense;            // Boss 防御值（固定，不缩放）
      this.ang = Math.PI / 2;
      this.phaseIdx = 0;
      this.mode = BOSS_DEF.phases[0].mode;
      this.fireCd = BOSS_DEF.phases[0].fireCd / this.scale; // 缩放射速
      this.bSpeed = Math.round(BOSS_DEF.phases[0].bSpeed * this.scale);
      this.dmg = Math.round(BOSS_DEF.phases[0].dmg * this.scale);
      this.fireT = 2.5;                           // 首次攻击延迟（原1.5→2.5 给玩家喘息）
      this.spin = 0;
      this.t = 0;
      this.flashT = 0;
      this.alive = true;
      this.entering = true;        // 出场动画
      this.enterT = 0;
      this.targetY = game.H * 0.16;
      this.summonT = 8;            // 召唤间隔（仅高难度 scale>1 时启用）
      this.invuln = 0;
    }

    update(dt, game) {
      this.t += dt;
      this.spin += dt * 1.5;
      this.flashT = Math.max(0, this.flashT - dt);
      this.invuln = Math.max(0, this.invuln - dt);

      if (this.entering) {
        this.enterT += dt;
        // 从屏幕外缓动下降到目标位置
        const k = Math.min(1, this.enterT / 2.2);
        this.cy = TG.lerp(-80, this.targetY, 1 - Math.pow(1 - k, 3));
        if (k >= 1) { this.entering = false; this.invuln = 0.3; }
        return;
      }

      // 水平游荡
      this.cx = this.game.W / 2 + Math.sin(this.t * 0.6) * (this.game.W * 0.3);

      // 阶段切换（应用 scale 缩放）
      const ratio = this.hp / this.maxHp;
      for (let i = BOSS_DEF.phases.length - 1; i >= 0; i--) {
        if (ratio <= BOSS_DEF.phases[i].at && this.phaseIdx < i) {
          this.phaseIdx = i;
          const ph = BOSS_DEF.phases[i];
          this.mode = ph.mode;
          this.fireCd = ph.fireCd / this.scale;   // 缩放射速
          this.bSpeed = Math.round(ph.bSpeed * this.scale);
          this.dmg = Math.round(ph.dmg * this.scale);
          game.onBossPhase(i);
          break;
        }
      }

      // 攻击
      this.fireT -= dt;
      if (this.fireT <= 0 && this.invuln <= 0) {
        this.attack(game);
        this.fireT = this.fireCd;
      }
      // 高难度（scale > 1.2）时才召唤小怪
      if (this.scale > 1.2 && this.phaseIdx >= 1) {
        this.summonT -= dt;
        if (this.summonT <= 0) {
          TG.enemies.spawn('grunt', this.cx + TG.rand(-40, 40), this.cy + this.r, game.tension, game, game.level);
          this.summonT = 8;
        }
      }
    }

    attack(game) {
      const p = game.player;
      const ox = this.cx, oy = this.cy + this.r;
      const opts = { color: this.def.color, r: 5, life: 4 };
      if (this.mode === 'spiral') {
        // 首战螺旋弹：3 发（原 4 发）
        const n = 3;
        for (let i = 0; i < n; i++) {
          const a = this.spin * 2 + (i / n) * TG.TAU;
          TG.bullets.fire(ox, oy, a, this.bSpeed, 'enemy', this.dmg, opts);
        }
      } else if (this.mode === 'aimed') {
        // 瞄准散射：3 发（原 5 发），角度更宽
        const base = p ? Math.atan2(p.cy - oy, p.cx - ox) : Math.PI / 2;
        for (let i = -1; i <= 1; i++) {
          TG.bullets.fire(ox, oy, base + i * 0.22, this.bSpeed, 'enemy', this.dmg, opts);
        }
      } else { // bullet-hell（仅高难度后备，已不在首战阶段出现）
        const n = Math.min(8, Math.floor(6 * this.scale));
        for (let i = 0; i < n; i++) {
          const a = this.spin * 3 + (i / n) * TG.TAU;
          TG.bullets.fire(ox, oy, a, this.bSpeed, 'enemy', this.dmg, opts);
        }
        // 高难度才加追踪弹
        if (p && this.scale > 1.3) {
          const a = Math.atan2(p.cy - oy, p.cx - ox);
          TG.bullets.fire(ox, oy, a, this.bSpeed * 1.4, 'enemy', this.dmg, { ...opts, homing: 0.6, target: p });
        }
      }
      TG.audio.sfxEnemyShoot();
    }

    takeDamage(d) {
      if (this.invuln > 0 || this.entering) return false;
      // Boss 防御减伤
      const actual = Math.max(1, Math.round(d - this.defense));
      this.hp -= actual;
      this.flashT = 0.1;
      TG.particles.hit(this.cx + TG.rand(-this.r, this.r), this.cy + TG.rand(-this.r, this.r), Math.random() * TG.TAU, this.def.color);
      // 伤害飘字（Boss 命中用黄色）
      TG.floatTexts.spawn(this.cx + TG.rand(-this.r, this.r), this.cy + TG.rand(-this.r, this.r), actual, '#ffd24a');
      if (this.hp <= 0) { this.alive = false; return true; }
      return false;
    }

    render(ctx) {
      ctx.save();
      ctx.translate(this.cx, this.cy);
      const pulse = 1 + Math.sin(this.t * 3) * 0.04;
      ctx.scale(pulse, pulse);
      // 外环旋转装甲
      ctx.save();
      ctx.rotate(this.spin);
      ctx.strokeStyle = this.def.accent; ctx.lineWidth = 3;
      ctx.shadowColor = this.def.color; ctx.shadowBlur = 22;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TG.TAU;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * (this.r + 14), Math.sin(a) * (this.r + 14), 6, 0, TG.TAU);
        ctx.stroke();
      }
      ctx.restore();
      // 核心
      ctx.shadowColor = this.def.color; ctx.shadowBlur = 30;
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, this.r);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.4, this.def.accent);
      g.addColorStop(1, this.def.color);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, this.r, 0, TG.TAU); ctx.fill();
      ctx.shadowBlur = 0;
      // 阶段指示：内圈数量
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.7;
      for (let i = 0; i <= this.phaseIdx; i++) {
        ctx.beginPath(); ctx.arc(0, 0, this.r * (0.55 + i * 0.12), 0, TG.TAU); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (this.flashT > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, TG.TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.restore();

      // Boss 血条（顶部）
      if (!this.entering) this._drawBar(ctx);
    }

    _drawBar(ctx) {
      const w = this.game.W * 0.7, h = 10, x = (this.game.W - w) / 2, y = 14;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
      ctx.fillStyle = '#2a1622';
      ctx.fillRect(x, y, w, h);
      const ratio = Math.max(0, this.hp / this.maxHp);
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#ff3a6b'); grad.addColorStop(1, '#ffb0c8');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w * ratio, h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(this.def.name + '  ·  ' + Math.ceil(ratio * 100) + '%', this.game.W / 2, y + h / 2);
    }

    hitCircle() { return { x: this.cx, y: this.cy, r: this.r - 4 }; }
  }

  TG.Boss = Boss;
  TG.BOSS_DEF = BOSS_DEF;
})(window.TG = window.TG || {});

(function (TG) {

  const CHARS = [

    {
      id: 'phantom', name: '幻影', title: '特战型·量子扰动',
      hp: 95, speed: 200, dmg: 13, fireCd: 0.24, bSpeed: 600, color: '#c06bff', accent: '#e8c8ff',
      desc: '技能冷却更快，护盾与清屏频繁释放。', tag: '特战',
    },
  ];

  class Player {
    constructor(charId, game, pidx) {
      const c = CHARS.find((x) => x.id === charId) || CHARS[0];
      this.char = c;
      this.game = game;
      this.pidx = pidx || 0;  // 0=玩家1, 1=玩家2
      this.W = game.W; this.H = game.H;
      // 双人模式下分屏站位：P1 右下偏移，P2 左下偏移
      if (this.pidx === 1) {
        this.cx = this.W * 0.3; this.cy = this.H * 0.78;
      } else {
        this.cx = game.player2 ? this.W * 0.7 : this.W / 2; // 若有P2则P1偏右，单人居中
        this.cy = this.H * 0.78;
      }
      this.r = 18;                                       // 碰撞半径
      this.maxHp = c.hp; this.hp = c.hp;
      this.speed = c.speed;
      this.dmg = c.dmg;
      this.fireCd = c.fireCd;
      this.bSpeed = c.bSpeed;
      this.color = c.color; this.accent = c.accent;
      this.ang = -Math.PI / 2;                            // 炮塔朝向（默认向上）
      this.fireT = 0;
      this.autoFire = true;
      this.alive = true;                                  // 存活标记
      // 技能冷却（秒）
      this.skShieldCd = 0; this.skShieldMax = c.id === 'phantom' ? 7 : 12;
      this.skClearCd = 0; this.skClearMax = c.id === 'phantom' ? 14 : 20;
      this.shield = 0; this.shieldMax = 4;               // 护盾持续时间
      // 道具增益计时
      this.pwrUp = 1; this.pwrMax = 1;                   // 火力倍率（默认1=满火力）
      this.spdUp = 1; this.spdMax = 1;                  // 速度倍率（默认1=满速度）
      this.scoreMul = 1; this.scoreMulT = 0;
      this.invuln = 1.0;                                  // 出生短暂无敌
      this.thrustT = 0;
      this.flashT = 0;                                    // 受击闪烁
      // 幻影残影系统
      this._trail = [];               // 历史位置记录
      this._trailT = 0;                // 采样计时
      this._lastTrailX = this.cx;     // 上次采样位置
      this._lastTrailY = this.cy;
      // PK 模式下 P2 使用不同的子弹颜色以区分
      if (this.pidx === 1) {
        this.accent = c.id === 'guardian' ? '#ffb13a' : '#ff5a8a';
      }
    }

    // 输入处理（每帧），根据 pidx 使用不同键位
    control(input, dt, mouse) {
      const g = this.game;
      let mx = 0, my = 0;
      if (this.pidx === 0) {
        // 玩家1：WASD
        if (input.has('KeyW')) my -= 1;
        if (input.has('KeyS')) my += 1;
        if (input.has('KeyA')) mx -= 1;
        if (input.has('KeyD')) mx += 1;
      } else {
        // 玩家2：方向键
        if (input.has('ArrowUp')) my -= 1;
        if (input.has('ArrowDown')) my += 1;
        if (input.has('ArrowLeft')) mx -= 1;
        if (input.has('ArrowRight')) mx += 1;
      }
      if (mx || my) {
        const len = Math.hypot(mx, my);
        mx /= len; my /= len;
        const sp = this.speed * this.spdUp * dt;
        this.cx = TG.clamp(this.cx + mx * sp, this.r, this.W - this.r);
        this.cy = TG.clamp(this.cy + my * sp, this.r, this.H - this.r);
        // 引擎尾焰
        this.thrustT -= dt;
        if (this.thrustT <= 0) {
          TG.particles.thrust(this.cx, this.cy, Math.atan2(-my, -mx), this.accent);
          this.thrustT = 0.03;
        }
      }
      // 炮塔瞄准：P1 鼠标优先否则自动瞄准；P2 始终自动瞄准最近敌人
      let aimAng = this.ang;
      if (this.pidx === 0 && mouse.active) {
        aimAng = Math.atan2(mouse.y - this.cy, mouse.x - this.cx);
      } else {
        const t = g.nearestEnemy(this.cx, this.cy, this.pidx);
        if (t) aimAng = Math.atan2(t.cy - this.cy, t.cx - this.cx);
      }
      this.ang = TG.turnToward(this.ang, aimAng, 12 * dt);

      // 射击
      this.fireT -= dt;
      let wantShoot = this.autoFire;
      if (this.pidx === 0) {
        wantShoot = input.has('Space') || mouse.down || this.autoFire;
      } else {
        // P2：斜杠键(/) 或 小键盘0(Numpad0)
        wantShoot = input.has('Slash') || input.has('Numpad0') || this.autoFire;
      }
      if (wantShoot && this.fireT <= 0) {
        this.shoot();
        this.fireT = this.fireCd * (this.pwrUp >= 2 ? 0.85 : 1);
      }
    }

    shoot() {
      const g = this.game;
      const ox = this.cx + Math.cos(this.ang) * (this.r + 6);
      const oy = this.cy + Math.sin(this.ang) * (this.r + 6);
      const dmg = this.dmg * this.pwrUp;
      const opts = { color: this.accent, r: 4, pierce: this.pwrUp >= 2 ? 1 : 0, life: 2.2, shape: 'round' };
      // 火力等级越高，散射弹数越多
      const lvl = Math.min(3, Math.floor(this.pwrUp));
      if (lvl <= 1) {
        const b = TG.bullets.fire(ox, oy, this.ang, this.bSpeed, 'player', dmg, opts);
        if (b) b.owner = this.pidx; // 标记子弹所有者（PK模式区分）
      } else {
        const spread = 0.12;
        for (let i = -Math.floor((lvl - 1) / 2); i <= Math.floor((lvl - 1) / 2); i++) {
          const b = TG.bullets.fire(ox, oy, this.ang + i * spread, this.bSpeed, 'player', dmg, opts);
          if (b) b.owner = this.pidx;
        }
      }
      TG.particles.muzzle(ox, oy, this.ang, this.accent);
      TG.audio.sfxShoot();
      g.shake(2, 0.05);
    }

    // 技能：护盾
    skillShield() {
      if (this.skShieldCd > 0 || this.shield > 0) return false;
      this.shield = this.shieldMax;
      this.skShieldCd = this.skShieldMax;
      TG.audio.sfxShield();
      this.game.stats.shieldUsed++;
      this.game.ach.check('shield', this.game.stats.shieldUsed);
      return true;
    }
    // 技能：全屏清屏
    skillClear() {
      if (this.skClearCd > 0) return false;
      this.skClearCd = this.skClearMax;
      TG.audio.sfxClear();
      TG.particles.shockwave(this.cx, this.cy, this.accent);
      this.game.shake(10, 0.4);
      this.game.onClearScreen();
      this.game.stats.clearUsed++;
      this.game.ach.check('clear', this.game.stats.clearUsed);
      return true;
    }

    takeDamage(d, attackerIdx) {
      if (this.invuln > 0 || this.shield > 0) return false;
      this.hp -= d;
      this.flashT = 0.25;
      this.invuln = 0.6;
      TG.audio.sfxHurt();
      this.game.shake(8, 0.25);
      this.game.redFlash(0.5);
      this.game.stats.tookDamage = true;
      this.game.ach.check('hurt', 0);
      if (this.hp <= 0) {
        this.hp = 0; this.alive = false;
        this.game.onPlayerDeath(this.pidx, attackerIdx);
      }
      return true;
    }

    heal(v) { this.hp = Math.min(this.maxHp, this.hp + v); }

    applyPowerup(type) {
      const g = this.game;
      switch (type) {
        case 'fire':
          this.pwrUp = Math.min(3, this.pwrUp + 0.5); this.pwrMax = this.pwrUp;
          if (this.pwrUp >= 3) g.ach.unlock('maxfire'); break;
        case 'speed':
          this.spdUp = 1.45; this.spdMax = 1.45; break;
        case 'shield':
          this.shield = Math.max(this.shield, this.shieldMax); break;
        case 'heal':
          this.heal(this.maxHp * 0.35); break;
        case 'score':
          this.scoreMul = 2; this.scoreMulT = 10; break;
      }
      g.stats.powerups++;
      g.ach.check('powerup', g.stats.powerups);
      g.audio.sfxPickup();
      g.toast('拾取道具：' + POWERUP_NAMES[type]);
    }

    update(dt) {
      this.fireT -= 0; // 已在 control 处理
      this.skShieldCd = Math.max(0, this.skShieldCd - dt);
      this.skClearCd = Math.max(0, this.skClearCd - dt);
      this.shield = Math.max(0, this.shield - dt);
      this.invuln = Math.max(0, this.invuln - dt);
      this.flashT = Math.max(0, this.flashT - dt);
      this.scoreMulT = Math.max(0, this.scoreMulT - dt);
      if (this.scoreMulT <= 0) this.scoreMul = 1;
      if (this.spdMax > 1) { this.spdMax -= dt * 0.0; /* 维持到换档：简化为持续 */ }
      // 护盾环粒子
      if (this.shield > 0) TG.particles.shieldRing(this.cx, this.cy, this.r + 8, this.accent);

      // ====== 幻影残影：记录历史位置 ======
      this._trailT -= dt;
      if (this._trailT <= 0) {
        // 仅在移动时记录残影（位移 >1px 才算移动）
        if (Math.abs(this.cx - this._lastTrailX) > 1 || Math.abs(this.cy - this._lastTrailY) > 1) {
          this._trail.push({ x: this.cx, y: this.cy, ang: this.ang, age: 0 });
          if (this._trail.length > 10) this._trail.shift();   // 限制数量
        }
        this._lastTrailX = this.cx; this._lastTrailY = this.cy;
        this._trailT = 0.04;                                    // 每 40ms 采样
      }
      // 残影老化 + 清理
      for (const t of this._trail) t.age += dt;
      this._trail = this._trail.filter((t) => t.age < 0.3);   // 0.3秒后消失
    }

    render(ctx) {
      // 幻影残影（在车身之前绘制）
      this._renderTrail(ctx);
      ctx.save();
      ctx.translate(this.cx, this.cy);
      // 护盾
      if (this.shield > 0) {
        ctx.globalAlpha = 0.3 + 0.2 * Math.sin(performance.now() / 90);
        ctx.strokeStyle = this.accent;
        ctx.lineWidth = 3;
        ctx.shadowColor = this.accent; ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.arc(0, 0, this.r + 10, 0, TG.TAU); ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
      // 无敌闪烁
      if (this.invuln > 0 && this.shield <= 0 && Math.floor(this.invuln * 20) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }
      // 受击红色覆盖
      if (this.flashT > 0) { ctx.globalAlpha *= 0.9; }
      // 车身
      ctx.rotate(this.ang + Math.PI / 2);
      this._drawBody(ctx);
      ctx.restore();

      if (this.flashT > 0) { ctx.globalAlpha = 1; }
    }

    // 绘制幻影残影：历史位置的半透明剪影，随时间淡出
    _renderTrail(ctx) {
      const r = this.r;
      for (const t of this._trail) {
        const a = (1 - t.age / 0.3) * 0.25;  // 最大 25% 透明度，渐隐
        if (a <= 0.01) continue;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(t.x, t.y);
        // 车身剪影
        ctx.rotate(t.ang + Math.PI / 2);
        ctx.shadowColor = this.color; ctx.shadowBlur = 8;
        ctx.fillStyle = this.color;
        this._roundRect(ctx, -r, -r + 2, r * 2, r * 2 - 4, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
        // 炮管剪影
        ctx.rotate(-(t.ang + Math.PI / 2));
        ctx.rotate(t.ang);
        ctx.fillStyle = this.accent;
        ctx.fillRect(0, -3, r + 8, 6);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    _drawBody(ctx) {
      const r = this.r;
      // 履带
      ctx.fillStyle = '#16243a';
      ctx.fillRect(-r - 4, -r + 2, r * 2 + 8, 5);
      ctx.fillRect(-r - 4, r - 7, r * 2 + 8, 5);
      ctx.fillStyle = '#243a55';
      for (let i = -r; i < r; i += 6) {
        ctx.fillRect(i, -r + 2, 3, 5);
        ctx.fillRect(i, r - 7, 3, 5);
      }
      // 车体
      ctx.shadowColor = this.color; ctx.shadowBlur = 14;
      ctx.fillStyle = this.color;
      this._roundRect(ctx, -r, -r + 2, r * 2, r * 2 - 4, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      // 装甲条纹
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-r + 3, -r + 6, r * 2 - 6, 3);
      // 核心发光
      ctx.fillStyle = this.accent;
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, TG.TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TG.TAU); ctx.fill();
      // 炮塔旋转回正以画炮管
      ctx.rotate(-(this.ang + Math.PI / 2));
      // 炮管（朝 ang 方向）
      ctx.rotate(this.ang);
      ctx.fillStyle = this.accent;
      ctx.shadowColor = this.accent; ctx.shadowBlur = 10;
      ctx.fillRect(0, -3, r + 10, 6);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.fillRect(r + 4, -1.5, 4, 3);
    }

    _roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 碰撞圆
    hitCircle() { return { x: this.cx, y: this.cy, r: this.r - 2 }; }
  }

  const POWERUP_NAMES = { fire: '火力提升', speed: '速度提升', shield: '护盾充能', heal: '生命恢复', score: '分数加倍' };

  TG.Player = Player;
  TG.CHARS = CHARS;
  TG.POWERUP_NAMES = POWERUP_NAMES;
})(window.TG = window.TG || {});

    // 返回已解锁成就按获得时间排序（从早到晚）

        .filter((d) => this.unlocked[d.id])

      return this.defs.filter((d) => !this.unlocked[d.id]);

    // 累计统计
    addStat(key, n) { this._stats[key] = (this._stats[key] || 0) + n; this._save(); }

    // 触发检查（按事件类型）
    check(event, value) {

        case 'kills':

          break;

        case 'boss':

            if (value.coop) this.unlock('coop_win');         // 同袍之义
            if (value.pk) this.unlock('pk_win');             // 决斗之王
            if (value.inferno) this.unlock('inferno_win');   // 炼狱行者
            if (value.noItems) this.unlock('no_items');     // 苦修战士
            if (value.clear3) this.unlock('clear3_win');    // 三重净化
            if (value.noSkill) this.unlock('no_skill');     // 禁欲行者
            if (value.noDamage) this.unlock('untouchable'); // 不坏金身
          }
          break;
      }
    }

    unlock(id) {
      if (this.unlocked[id]) return false;
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const time = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      this.unlocked[id] = time;
      this._save();
      const def = this.defs.find((d) => d.id === id);
      if (def) {
        this.queue.push({ def, time });
        TG.audio && TG.audio.sfxAchievement();
      }
      return true;
    }

    // 取一个待弹窗
    pop() { return this.queue.shift() || null; }
    hasPop() { return this.queue.length > 0; }
  }

  TG.Achievement = Achievement;
})(window.TG = window.TG || {});

      return stat('生命', c.hp, 160, '#ff5a8a') + stat('速度', c.speed, 240, '#7cff8a') +

    _drawAvatar(cv, c) {
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, 120, 120);
      const t = performance.now() / 1000;
      ctx.save(); ctx.translate(60, 64); ctx.rotate(t * 0.4);
      ctx.shadowColor = c.color; ctx.shadowBlur = 16;
      ctx.fillStyle = c.color;
      ctx.fillRect(-22, -16, 44, 32);
      ctx.fillStyle = c.accent; ctx.beginPath(); ctx.arc(0, 0, 6, 0, TG.TAU); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(60, 64); ctx.rotate(-Math.PI / 2 + Math.sin(t) * 0.2);
      ctx.fillStyle = c.accent; ctx.fillRect(0, -3, 36, 6);
      ctx.restore();
      // 不断刷新
      if (!cv._raf) {
        const loop = () => { this._drawAvatarFrame(cv, c); cv._raf = requestAnimationFrame(loop); };
        cv._raf = requestAnimationFrame(loop);

    _drawAvatarFrame(cv, c) {
      const ctx = cv.getContext('2d');

      ctx.save(); ctx.translate(60, 66);
      ctx.fillStyle = '#16243a'; ctx.fillRect(-30, -20, 60, 8); ctx.fillRect(-30, 12, 60, 8);
      ctx.save(); ctx.rotate(t * 0.4);
      ctx.shadowColor = c.color; ctx.shadowBlur = 14; ctx.fillStyle = c.color;
      ctx.fillRect(-22, -14, 44, 28);
      ctx.fillStyle = c.accent; ctx.beginPath(); ctx.arc(0, 0, 5, 0, TG.TAU); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.rotate(-Math.PI / 2 + Math.sin(t) * 0.25);
      ctx.fillStyle = c.accent; ctx.shadowColor = c.accent; ctx.shadowBlur = 10;
      ctx.fillRect(0, -3, 34, 6); ctx.shadowBlur = 0;
      ctx.restore();
      ctx.restore();

    _drawLevelThumb(cv, i) {
      const ctx = cv.getContext('2d');
      const W = 180, H = 100;
      ctx.fillStyle = '#0a0f1a'; ctx.fillRect(0, 0, W, H);
      const t = performance.now() / 1000;
      const colors = ['#3ad1ff', '#7cff8a', '#ffb13a', '#ff3a6b'];
      const c = colors[i];
      // 星点
      ctx.fillStyle = '#2a3a55';
      for (let k = 0; k < 30; k++) {
        const x = (k * 53 + t * 20) % W, y = (k * 37) % H;
        ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t + k));
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;
      // 中心机甲轮廓
      ctx.save(); ctx.translate(W / 2, H / 2 + Math.sin(t * 2) * 4);
      ctx.shadowColor = c; ctx.shadowBlur = 12; ctx.fillStyle = c;
      ctx.fillRect(-16, -12, 32, 24);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TG.TAU); ctx.fill();

    // ---- 屏幕切换（带过渡） ----
    show(name) {

    _startMeteors() {
      const layer = this.screens.menu.querySelector('#meteor-layer');

      this._stopMeteors(); // 先清理旧的定时器
      const spawn = () => {
        if (this.game.state !== 'menu') return; // 仅主菜单生成
        if (layer.children.length < 4) {        // 限制同屏流星数量
          const m = document.createElement('div');
          m.className = 'meteor';
          const W = window.innerWidth, H = window.innerHeight;
          // 随机起始位置：从屏幕右上区域进入
          m.style.left = (W * 0.35 + Math.random() * W * 0.65) + 'px';
          m.style.top = (-30 - Math.random() * H * 0.15) + 'px';
          // 随机角度：向左下方飞（120°~160°）
          const rot = 120 + Math.random() * 40;
          // 飞行距离：足够飞出屏幕
          const dist = Math.max(W, H) * 1.6;
          m.style.setProperty('--rot', rot + 'deg');
          m.style.setProperty('--dist', dist + 'px');
          // 随机时长（0.7s~1.5s），随机大小
          const dur = 700 + Math.random() * 800;
          const scale = 0.7 + Math.random() * 0.8;
          m.style.width = (160 * scale) + 'px';
          m.style.animation = `meteorStreak ${dur}ms linear forwards`;
          layer.appendChild(m);
          m.addEventListener('animationend', () => m.remove());
        }
        // 随机间隔生成下一颗（1.2s~4s）
        this._meteorTimer = setTimeout(spawn, 1200 + Math.random() * 2800);
      };

      this._meteorTimer = setTimeout(spawn, 300);
    }
    _stopMeteors() {
      if (this._meteorTimer) { clearTimeout(this._meteorTimer); this._meteorTimer = null; }

/* ===== game.js ===== */
/* =====================================================================
 * game.js — 游戏主类
 *   - 状态机：loading/menu/char/level/settings/battle/pause/results/gallery
 *   - 固定步长游戏循环（固定 1/60s 逻辑 + 可变渲染）
 *   - 波次系统 / 紧张度 / 屏幕震动 / 红屏闪 / 慢动作
 *   - 碰撞检测（圆-圆，分阵营）
 *   - BGM 阶段切换 / 成就轮询 / CG 编排
 * ===================================================================== */
(function (TG) {
  'use strict';

  const STEP = 1 / 60;          // 固定逻辑步长
  const STAR_N = 160;           // 背景星数

  class Game {
    constructor() {
      this.canvas = document.getElementById('game');
      this.ctx = this.canvas.getContext('2d');
      // 先初始化 UI 依赖的数据，再构造 UI（_build 会读取这些字段）
      this.audio = TG.audio;
      this.ach = new TG.Achievement();
      this.bestScore = TG.store.get('tk_best', 0);
      this.selectedChar = 'guardian';
      this.selectedLevel = 'normal';
      this.levelGrow = 1.0;
      this.autoFireDefault = true;
      this.gameMode = 'single';   // 'single' / 'coop' / 'pk'
      this.player2 = null;
      this.score2 = 0;            // P2 分数（PK模式）
      this.state = 'loading';
      this.prevSettings = 'menu';

      this.ui = new TG.UI(this);

      this.input = new Set();
      this.mouse = { x: 0, y: 0, down: false, active: false };
      this._touch = null;

      this._bindInput();
      this._resize();
      window.addEventListener('resize', () => this._resize());

      this.stars = this._makeStars();
      this.shakeT = 0; this.shakeAmp = 0; this.shakeDur = 0;
      this.redFlashV = 0;
      this.timeScale = 1;
      this._newAch = new Set();
      this._acc = 0; this._last = performance.now();
      this._loop = this._loop.bind(this);
      this._initBattleState();
      this.ui.show('loading');   // 初始显示加载界面
      requestAnimationFrame(this._loop);
    }

    _initBattleState() {
      this.player = null;
      this.player2 = null;
      this.boss = null;
      this.score = 0;
      this.score2 = 0;
      this.wave = 0;
      this.combo = 0; this.comboT = 0;
      this.tension = 0;
      this.spawnT = 0;
      this.waveT = 0;
      this.bossOut = false;
      this.level = 1;             // 当前关卡（1 或 2）
      this.maxLevel = 2;          // 最大关卡数
      this.cg = null;            // 当前 CG 状态
      this.cgT = 0;
      this._pkWinner = null;     // PK模式胜者
      this.stats = { kills: 0, eliteKills: 0, maxCombo: 0, tookDamage: false, shieldUsed: 0, clearUsed: 0, powerups: 0 };
      TG.bullets.clear(); TG.enemies.clear(); TG.powerups.clear(); TG.particles.clear(); TG.floatTexts.clear();
    }

    _makeStars() {
      const a = [];
      for (let i = 0; i < STAR_N; i++) {
        a.push({ x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2, s: Math.random() * 1.6 + 0.3 });
      }
      return a;
    }

    // ============== 输入 ==============
    _bindInput() {
      const set = this.input;
      addEventListener('keydown', (e) => {
        // 防止空格/方向键滚动页面
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Slash'].includes(e.code)) e.preventDefault();
        set.add(e.code);
        // 技能快捷键
        if (this.state === 'battle' && this.player) {
          // 玩家1技能
          if (e.code === 'KeyQ') this.player.skillShield();
          if (e.code === 'KeyE') this.player.skillClear();
          if (e.code === 'KeyR') this.trySurrender();
          // 玩家2技能（双人模式）
          if (this.player2 && this.player2.alive) {
            if (e.code === 'Period') this.player2.skillShield();        // 句号(.) 护盾
            if (e.code === 'Comma') this.player2.skillClear();         // 逗号(,) 清屏
            if (e.code === 'ControlRight') this._p2Surrender();        // 右Ctrl 投降
            if (e.code === 'Numpad1' || (e.code === 'Slash' && false)) { /* reserved */ }
          }
          // 通用
          if (e.code === 'KeyP' || e.code === 'Escape') this.togglePause(true);
          if (e.code === 'KeyF') {
            this.player.autoFire = !this.player.autoFire;
            this.toast('P1 自动射击：' + (this.player.autoFire ? '开' : '关'));
            if (this.player2) { this.player2.autoFire = this.player.autoFire; }
          }
        } else {
          if (e.code === 'Escape' && this.state !== 'loading' && this.state !== 'menu') this.go('menu');
        }
      });
      addEventListener('keyup', (e) => set.delete(e.code));

      const cv = this.canvas;
      cv.addEventListener('mousemove', (e) => {
        const r = cv.getBoundingClientRect();
        this.mouse.x = (e.clientX - r.left) * (this.W / r.width);
        this.mouse.y = (e.clientY - r.top) * (this.H / r.height);
        this.mouse.active = true;
      });
      cv.addEventListener('mousedown', () => { this.mouse.down = true; this.audio.resume(); });
      addEventListener('mouseup', () => this.mouse.down = false);
      cv.addEventListener('mouseleave', () => { this.mouse.active = false; this.mouse.down = false; });

      // 触摸：左半屏拖拽移动，右半屏瞄准射击
      cv.addEventListener('touchstart', (e) => { this._onTouch(e, 'start'); e.preventDefault(); }, { passive: false });
      cv.addEventListener('touchmove', (e) => { this._onTouch(e, 'move'); e.preventDefault(); }, { passive: false });
      cv.addEventListener('touchend', (e) => { this._onTouch(e, 'end'); e.preventDefault(); }, { passive: false });
    }
    _onTouch(e, phase) {
      const r = this.canvas.getBoundingClientRect();
      const t = e.changedTouches[0];
      const x = (t.clientX - r.left) * (this.W / r.width);
      const y = (t.clientY - r.top) * (this.H / r.height);
      if (phase === 'start') { this._touch = { x, y, side: x < this.W / 2 ? 'move' : 'aim' }; this.audio.resume(); }
      else if (phase === 'move' && this._touch) { this._touch.x = x; this._touch.y = y; }
      else if (phase === 'end') { this._touch = null; this.mouse.down = false; }
      if (this._touch && this._touch.side === 'aim') { this.mouse.x = x; this.mouse.y = y; this.mouse.active = true; this.mouse.down = true; }
    }

    _resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      this.W = window.innerWidth; this.H = window.innerHeight;
      this.canvas.width = this.W * dpr; this.canvas.height = this.H * dpr;
      this.canvas.style.width = this.W + 'px'; this.canvas.style.height = this.H + 'px';
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (this.player) { this.player.W = this.W; this.player.H = this.H; }
      if (this.player2) { this.player2.W = this.W; this.player2.H = this.H; }
    }

    // ============== 状态切换 ==============
    go(state) {
      if (state === 'battle') return; // battle 由 startBattle 处理
      this.state = state;
      this.ui.show(state);
      if (state === 'menu') this.resumeMenuMusic();
